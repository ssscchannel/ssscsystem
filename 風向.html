<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>晟自然玩科學｜風向與風力</title><style>
:root{--subject:#ef9db8;--subject-deep:#cf6f91;--subject-soft:#fff0f5;--subject-line:#f3c6d5;--ink:#3f3f46}*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:'Microsoft JhengHei','Segoe UI',sans-serif;color:#333;background:url('page.jpg') center/cover}body{display:flex;justify-content:center}.app-layout-wrapper{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.9)}.main-header{flex:0 0 60px;min-height:60px;width:100%;background:linear-gradient(90deg,#1a2a6c,#b21f1f,#fdbb2d);box-shadow:0 2px 8px #0003;z-index:100;display:flex;align-items:center;padding:0 15px;color:#fff}.logo-area{width:40px;height:40px;border-radius:50%;margin-right:14px;background:#fff url('logo.jpg') center/cover;border:2px solid #00d2ff;flex-shrink:0}.header-title{min-width:0;display:flex;align-items:center;flex-wrap:nowrap;gap:7px;flex:1;font-size:1rem;line-height:1;white-space:nowrap;overflow:hidden;text-shadow:1px 1px 2px #0005;padding-right:10px}.brand-name{font-weight:900;flex-shrink:0}.title-divider{opacity:.65}.module-name{font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{margin-left:auto;flex-shrink:0;background:#00B900;color:#fff;text-decoration:none;padding:6px 11px;border-radius:20px;font-size:.82rem;line-height:1;font-weight:bold;border:1px solid #ffffff80}.content-scroll-area{flex:1;min-height:0;overflow:hidden;width:100%;display:flex;flex-direction:column;align-items:center;position:relative;padding:0 10px 10px}.simulation-container{width:100%;height:100%;position:relative;background:rgba(0,0,0,.3);border-radius:0 0 12px 12px;overflow:hidden;box-shadow:0 5px 15px #0002}canvas{width:100%;height:100%;display:block}.status-float{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:calc(100% - 44px);max-width:460px;background:rgba(255,255,255,.97);padding:10px 12px 11px;border-radius:14px;box-shadow:0 3px 12px rgba(90,55,70,.10);border:1.5px solid var(--subject-line);border-left:5px solid var(--subject);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10;pointer-events:none}.status-main{font-size:1.15rem;font-weight:900;color:var(--subject-deep);line-height:1.2}.status-sub{font-size:.9rem;color:#555;font-weight:bold;line-height:1.25}.controls-dock{flex:0 0 auto;width:calc(100% - 20px);margin:0 10px 8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border:1.5px solid var(--subject-line);border-radius:14px;box-shadow:0 -2px 12px rgba(90,55,70,.08),0 3px 12px rgba(90,55,70,.08);z-index:100}.d-pad-container{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,58px);gap:8px;width:100%}.d-btn,.center-btn{width:100%;height:100%;border-radius:9px;cursor:pointer;font-weight:bold;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.12s;box-shadow:none}.d-btn{background:#fff;border:1.5px solid var(--subject-line);color:#554a50}.d-btn:hover{background:var(--subject-soft);border-color:var(--subject)}.d-btn.active{background:var(--subject);color:#fff;border-color:var(--subject-deep)}.d-btn:active,.d-btn.active:active{transform:translateY(1px)}.center-btn{border:1.5px solid var(--subject-line);color:#fff;background:#95a5a6}.center-btn:active{transform:scale(.97)}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.88rem;gap:4px;padding-right:6px}.line-btn{font-size:.74rem;padding:6px 8px}.content-scroll-area{padding:0 6px 6px}.status-float{width:calc(100% - 28px);top:10px;padding:9px 10px}.status-main{font-size:1.05rem}.status-sub{font-size:.82rem}.controls-dock{width:calc(100% - 12px);margin:0 6px 6px;padding:9px 9px calc(9px + env(safe-area-inset-bottom))}.d-pad-container{grid-template-rows:repeat(3,54px);gap:7px}.d-btn,.center-btn{font-size:.95rem}}
</style></head><body><div class="app-layout-wrapper"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">風向與風力</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><main class="content-scroll-area"><div class="status-float"><div class="status-main" id="text-main">北風－無風</div><div class="status-sub" id="text-sub">空氣沒有流動</div></div><div class="simulation-container" id="sim-container"><canvas id="mainCanvas"></canvas></div></main><footer class="controls-dock"><div class="d-pad-container"><button class="d-btn" data-dir="NW">西北</button><button class="d-btn" data-dir="N">北</button><button class="d-btn" data-dir="NE">東北</button><button class="d-btn" data-dir="W">西</button><button id="force-toggle-btn" class="center-btn">無風</button><button class="d-btn" data-dir="E">東</button><button class="d-btn" data-dir="SW">西南</button><button class="d-btn" data-dir="S">南</button><button class="d-btn" data-dir="SE">東南</button></div></footer></div><script>
const DIRS={N:{name:'北',to:'南',angle:270},NE:{name:'東北',to:'西南',angle:315},E:{name:'東',to:'西',angle:0},SE:{name:'東南',to:'西北',angle:45},S:{name:'南',to:'北',angle:90},SW:{name:'西南',to:'東北',angle:135},W:{name:'西',to:'東',angle:180},NW:{name:'西北',to:'東南',angle:225}};const FORCES=[{name:'無風',speed:0,lift:0},{name:'微風',speed:3,lift:.4},{name:'強風',speed:12,lift:.95}];let state={dir:'N',force:0,time:0,smoke:[],lines:[]},canvas,ctx,w,h;
function init(){document.getElementById('force-toggle-btn').addEventListener('click',()=>{state.force=(state.force+1)%3;updateInfo();updateCenterBtn()});document.querySelectorAll('.d-btn').forEach(b=>b.addEventListener('click',()=>{if(!b.dataset.dir)return;state.dir=b.dataset.dir;updateDirectionUI();updateInfo()}));canvas=document.getElementById('mainCanvas');ctx=canvas.getContext('2d');resize();window.addEventListener('resize',resize);for(let i=0;i<30;i++)state.lines.push(createLine());updateDirectionUI();updateInfo();updateCenterBtn(false);requestAnimationFrame(loop)}function updateCenterBtn(anim=true){const b=document.getElementById('force-toggle-btn'),c=[['無風','#95a5a6'],['微風','#ef9db8'],['強風','#cf6f91']][state.force];b.innerText=c[0];b.style.backgroundColor=c[1];if(anim&&b.animate)b.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:100})}function updateDirectionUI(){document.querySelectorAll('.d-btn').forEach(b=>b.classList.remove('active'));const b=document.querySelector(`.d-btn[data-dir="${state.dir}"]`);if(b)b.classList.add('active')}function updateInfo(){const d=DIRS[state.dir],f=FORCES[state.force],m=document.getElementById('text-main'),s=document.getElementById('text-sub');m.innerText=`${d.name}風－${f.name}`;if(!state.force){s.innerText='空氣沒有流動';s.style.color='#777'}else{s.innerText=`從${d.name}方吹向${d.to}方`;s.style.color='#cf6f91'}}function resize(){const c=document.getElementById('sim-container');w=c.clientWidth;h=c.clientHeight;const d=window.devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);canvas.style.width=w+'px';canvas.style.height=h+'px'}function createLine(){return{x:Math.random()*800-400,y:Math.random()*800-400,speedVar:.8+Math.random()*.4}}function createSmoke(){return{x:0,y:0,vx:(Math.random()-.5)*1.5,vy:-1.5-Math.random(),size:5+Math.random()*5,alpha:.6,life:80}}
function loop(){ctx.clearRect(0,0,w,h);state.time+=.05;const cx=w/2,cy=h/2+50,topY=cy-150,src=getVisualAngle(DIRS[state.dir].angle),flow=src+Math.PI;ctx.save();ctx.translate(cx,cy);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';[{txt:'E',ang:0},{txt:'S',ang:90},{txt:'W',ang:180},{txt:'N',ang:270}].forEach(i=>{const a=getVisualAngle(i.ang),x=Math.cos(a),y=Math.sin(a);ctx.beginPath();ctx.moveTo(x*100,y*100*.6);ctx.lineTo(x*140,y*140*.6);ctx.stroke();ctx.fillText(i.txt,x*155,y*155*.6)});ctx.restore();smoke(cx,topY,flow);if(state.force)lines(cx,cy,flow,false);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,topY);ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.lineCap='round';ctx.stroke();arrow(cx,topY,src);sock(cx,topY+30,flow);if(state.force)lines(cx,cy,flow,true);requestAnimationFrame(loop)}function smoke(cx,y,a){if(Math.random()<.3)state.smoke.push(createSmoke());const sp=FORCES[state.force].speed;ctx.save();ctx.translate(cx,y);for(let i=state.smoke.length-1;i>=0;i--){let p=state.smoke[i];p.life--;p.y+=p.vy;p.x+=p.vx;if(state.force){p.x+=Math.cos(a)*sp*.2;p.y+=Math.sin(a)*sp*.12;p.alpha-=.01}else p.alpha-=.005;if(p.life<=0||p.alpha<=0){state.smoke.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${p.alpha})`;ctx.fill()}ctx.restore()}function arrow(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ff4757';ctx.beginPath();ctx.moveTo(35,0);ctx.lineTo(15,-12);ctx.lineTo(15,12);ctx.closePath();ctx.fill();ctx.fillRect(-25,-4,40,8);ctx.beginPath();ctx.moveTo(-25,-4);ctx.lineTo(-45,-15);ctx.lineTo(-45,15);ctx.lineTo(-25,4);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.stroke();ctx.restore()}function sock(x,y,a){const l=FORCES[state.force].lift,drop=(1-l)*100,ext=l*100,dx=Math.cos(a)*ext,dy=Math.sin(a)*ext*.6,wave=state.force?Math.sin(state.time*5)*3*state.force:0;ctx.save();ctx.strokeStyle=state.force?'#f1c40f':'#bdc3c7';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+dx*.3,y+drop*.6+dy*.3,x+dx,y+drop+dy+wave);ctx.stroke();if(state.force){ctx.strokeStyle='#e67e22';ctx.setLineDash([10,10]);ctx.stroke()}ctx.restore()}function lines(cx,cy,a,front){const sp=FORCES[state.force].speed,vx=Math.cos(a)*sp,vy=Math.sin(a)*sp*.6;ctx.save();ctx.translate(cx,cy);ctx.strokeStyle=front?'rgba(255,255,255,.8)':'rgba(255,255,255,.2)';ctx.lineWidth=front?3:1;state.lines.forEach((p,i)=>{if((i%2===0)!==front)return;p.x+=vx*p.speedVar;p.y+=vy*p.speedVar;if(Math.abs(p.x)>400||Math.abs(p.y)>300){p.x=-vx*40+Math.random()*200-100;p.y=-vy*40+Math.random()*200-100}ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-vx*4,p.y-vy*4);ctx.stroke()});ctx.restore()}function getVisualAngle(d){const r=d*Math.PI/180,k=Math.tan(15*Math.PI/180),x=Math.cos(r),y=Math.sin(r);return Math.atan2(y,x-y*k)}window.addEventListener('load',init);
</script></body></html>
