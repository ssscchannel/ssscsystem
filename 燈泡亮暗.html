ect-line);border-left:5px solid var(--subject);border-radius:14px;box-shadow:0 3px 12px rgba(50,90,60,.10);padding:9px 11px}.controls-dock{flex:0 0 auto;width:calc(100% - 20px);margin:0 10px 8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff9;border:1.5px solid var(--subject-line);border-radius:14px;box-shadow:0 -2px 12px rgba(50,90,60,.08),0 3px 12px rgba(50,90,60,.08);z-index:1000;display:grid;grid-template-columns:1fr 1fr;gap:8px}.circuit-scene{position:absolute;width:100%;height:100%;display:none;top:0;left:0}.circuit-scene.active{display:block}.wire{position:absolute;background-image:linear-gradient(0deg,#2c3e50,#5d6d7e 40%,#85929e 60%,#2c3e50);border-radius:4px;z-index:1;box-shadow:1px 1px 2px #0005}.wire-h{height:6px}.wire-v{width:6px}.bulb-wrapper{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:10;transition:transform .1s;cursor:pointer}.bulb-wrapper:active{transform:scale(.95)}.bulb-glass{width:40px;height:40px;border-radius:50%;background:var(--bulb-off);border:2px solid #95a5a6;box-shadow:inset -2px -2px 5px #0003;position:relative;transition:all .3s ease}.bulb-base{width:20px;height:16px;background:linear-gradient(90deg,#7f8c8d,#bdc3c7,#95a5a6);border:1px solid #555;margin-top:-2px;border-radius:0 0 6px 6px;box-shadow:inset 1px 1px 2px #fff5;z-index:9}.lit-dim .bulb-glass{background:var(--bulb-dim);border-color:#d35400;box-shadow:0 0 5px var(--bulb-dim),inset -2px -2px 5px #0002}.lit-normal .bulb-glass{background:var(--bulb-normal);border-color:#f39c12;box-shadow:0 0 25px var(--bulb-normal),inset -2px -2px 5px #0002}.lit-bright .bulb-glass{background:var(--bulb-bright);border-color:#fff;box-shadow:0 0 50px var(--bulb-bright),0 0 80px rgba(255,255,224,.9),inset 0 0 10px #fff}.bulb-wrapper.is-broken .bulb-glass{background:#444!important;box-shadow:none!important;border-color:#333!important}.battery-group{position:absolute;display:flex;align-items:center;z-index:5;transition:transform .1s;cursor:pointer}.battery-group:active{transform:scale(.95)}.battery-body{width:60px;height:36px;background:linear-gradient(to bottom,#34495e,#5d6d7e 50%,#2c3e50);border:2px solid #ecf0f1;border-radius:4px;box-shadow:3px 3px 6px #0005;display:flex;justify-content:space-between;align-items:center;padding:0 5px;position:relative;transition:all .3s}.battery-cap{width:8px;height:18px;background:linear-gradient(to bottom,#bdc3c7,#ecf0f1,#bdc3c7);border:1px solid #95a5a6;border-right:none;border-radius:3px 0 0 3px;position:absolute;left:-8px;top:50%;transform:translateY(-50%);transition:all .3s}.bat-sign{font-weight:900;font-size:18px;line-height:1}.sign-plus{color:#ff5252;text-shadow:0 0 4px #ff5252cc}.sign-minus{color:#448aff;text-shadow:0 0 4px #448affcc}.battery-group.is-dead .battery-body{background:linear-gradient(to bottom,#7f8c8d,#95a5a6)!important;border-color:#7f8c8d!important}.battery-group.is-dead .battery-cap{background:#95a5a6!important}.battery-group.is-dead .sign-plus,.battery-group.is-dead .sign-minus{color:#bdc3c7!important;text-shadow:none!important}.scene-btn{padding:9px 5px;border:1px solid var(--subject-line);border-radius:9px;font-size:.88rem;cursor:pointer;color:#536159;transition:all .2s;background:#fff;font-family:inherit;line-height:1.2;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px}.scene-btn:active{transform:scale(.98)}.scene-btn.active{background:var(--subject-deep);border-color:var(--subject-deep);color:#fff;box-shadow:0 3px 7px rgba(50,90,60,.18)}#status-dashboard{min-height:78px;display:flex;flex-direction:column;justify-content:center}.dashboard-header-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:7px;margin-bottom:5px}.answer-badge{display:inline-block;color:#fff;font-size:.92rem;font-weight:bold;padding:3px 8px;border-radius:7px;box-shadow:0 2px 4px #0002}.dashboard-text-left{font-size:.9rem;color:#555;text-align:left;line-height:1.45;margin-bottom function init(){switchScene('A',document.querySelector('.scene-btn'));autoFitCircuit()}window.addEventListener('DOMContentLoaded',init);window.addEventListener('resize',autoFitCircuit);function autoFitCircuit(){const board=document.getElementById('circuit-board'),container=document.getElementById('sim-container'),logicalWidth=500,logicalHeight=450,availableWidth=container.clientWidth-20;let scale=Math.min(availableWidth/logicalWidth,1);board.style.transform=`scale(${scale})`;container.style.height=`${logicalHeight*scale}px`;container.style.minHeight=`${logicalHeight*scale}px`}function switchScene(mode,btn){document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.querySelectorAll('.circuit-scene').forEach(s=>s.classList.remove('active'));document.getElementById('scene-'+mode).classList.add('active');updatePhysics(mode)}function toggleState(element){const scene=element.closest('.circuit-scene');if(element.classList.contains('bulb-wrapper')){if(!element.classList.contains('is-broken')){const allBulbs=scene.querySelectorAll('.bulb-wrapper'),brokenBulbs=scene.querySelectorAll('.bulb-wrapper.is-broken');if(brokenBulbs.length+1>=allBulbs.length)return}element.classList.toggle('is-broken')}else if(element.classList.contains('battery-group'))element.classList.toggle('is-dead');recalcCircuitState(scene)}function recalcCircuitState(scene){const sceneId=scene.id,bulbs=scene.querySelectorAll('.bulb-wrapper'),allBats=scene.querySelectorAll('.battery-group'),deadBats=scene.querySelectorAll('.battery-group.is-dead'),isPowerOff=allBats.length>0&&allBats.length===deadBats.length;bulbs.forEach(b=>{b.classList.remove('lit-dim','lit-normal','lit-bright');if(!isPowerOff&&!b.classList.contains('is-broken')){if(sceneId==='scene-A')b.classList.add('lit-normal');if(sceneId==='scene-B')b.classList.add('lit-dim');if(sceneId==='scene-C')b.classList.add('lit-bright');if(sceneId==='scene-D')b.classList.add('lit-normal')}})}function updatePhysics(mode){document.querySelectorAll('.bulb-wrapper').forEach(b=>b.classList.remove('lit-dim','lit-normal','lit-bright','is-broken'));document.querySelectorAll('.battery-group').forEach(b=>b.classList.remove('is-dead'));const title=document.getElementById('infoTitle'),badge=document.getElementById('infoBrightness'),text=document.getElementById('infoText');let data={};if(mode==='A'){document.getElementById('a-b1').classList.add('lit-normal');document.getElementById('a-b2').classList.add('lit-normal');data={title:'燈泡串聯 ＋ 電池串聯',bright:'亮度：普通',desc:'電池串聯電力增強，但兩個燈泡串聯平分電壓，因此亮度適中。'}}else if(mode==='B'){document.getElementById('b-b1').classList.add('lit-dim');document.getElementById('b-b2').classList.add('lit-dim');data={title:'燈泡串聯 ＋ 電池並聯',bright:'亮度：最暗',desc:'電池並聯電壓不變（電力弱），且兩個燈泡串聯還要平分電壓，所以亮度最暗。'}}else if(mode==='C'){document.getElementById('c-b1').classList.add('lit-bright');document.getElementById('c-b2').classList.add('lit-bright');data={title:'燈泡並聯 ＋ 電池串聯',bright:'亮度：最亮',desc:'電池串聯讓電壓倍增，且燈泡並聯使每個燈泡都能獨享強大電壓，所以最亮。'}}else{document.getElementById('d-b1').classList.add('lit-normal');document.getElementById('d-b2').classList.add('lit-normal');data={title:'燈泡並聯 ＋ 電池並聯',bright:'亮度：普通',desc:'電池並聯電壓不變，燈泡並聯各自獨享電壓。整體情況與「1顆電池 + 1顆燈泡」完全相同。'}}title.innerText=data.title;badge.innerText=data.bright;text.innerText=data.desc;if(data.bright.includes('最亮'))badge.style.backgroundColor='#e74c3c';else if(data.bright.includes('最暗'))badge.style.backgroundColor='#7f8c8d';else badge.style.backgroundColor='#f39c12'}
