00%;transition:all .3s ease}.active-wire{left:-3px;top:-6px;bottom:-6px;width:8px;background-image:linear-gradient(-45deg,#ffffff40 25%,transparent 25%,transparent 50%,#ffffff40 50%,#ffffff40 75%,transparent 75%,transparent),linear-gradient(90deg,#a93226,var(--wire-red) 40%,#ec7063 60%,#a93226)}.wire-black{background-image:linear-gradient(-45deg,#ffffff40 25%,transparent 25%,transparent 50%,#ffffff40 50%,#ffffff40 75%,transparent 75%,transparent),linear-gradient(90deg,#2c3e50,#5d6d7e 40%,#85929e 60%,#2c3e50);z-index:1}.wire-top{top:-6px;left:-3px;right:-3px;height:8px}.wire-right{right:-3px;top:-6px;bottom:-6px;width:8px}.wire-bottom{bottom:-6px;left:-3px;right:-3px;height:8px}.flowing-down{animation:flowDown 1s linear infinite}.flowing-up{animation:flowUp 1s linear infinite}.flowing-right{animation:flowRight 1s linear infinite}.flowing-left{animation:flowLeft 1s linear infinite}.current-arrow{position:absolute;left:15px;top:50%;font-size:32px;color:#f39c12;font-weight:bold;text-shadow:1px 1px 0 #fff;z-index:50;pointer-events:none;animation:pulseArrowStrong 1.2s ease-in-out infinite}.compass{width:130px;height:130px;background:#fff;border:5px solid #bdc3c7;border-radius:50%;position:absolute;left:0;top:50%;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;transition:transform .3s ease;background-image:linear-gradient(0deg,transparent 49%,#eee 49%,#eee 51%,transparent 51%),linear-gradient(90deg,transparent 49%,#eee 49%,#eee 51%,transparent 51%)}.needle{width:14px;height:100px;position:relative;transition:transform .6s cubic-bezier(.4,1.5,.6,1);filter:drop-shadow(1px 1px 2px #0005)}.needle-n{position:absolute;top:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:50px solid #e74c3c}.needle-s{position:absolute;bottom:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:50px solid #2c3e50}.compass-mark{position:absolute;font-size:10px;color:#999;font-weight:bold}.battery-container{position:absolute;right:-25px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;z-index:5}.battery-body{width:50px;height:100px;background:linear-gradient(135deg,#34495e,#5d6d7e);border:2px solid #fff;border-radius:4px;box-shadow:4px 4px 10px #0003;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:5px 0}.battery-cap{width:20px;height:10px;background:#95a5a6;border:1px solid #7f8c8d}.bat-text{font-size:24px;font-weight:900;line-height:1}.text-plus{color:#ff5252;text-shadow:0 0 5px #ff525299}.text-minus{color:#448aff;text-shadow:0 0 5px #448aff99}.mode-wire-top .active-wire{z-index:20}.mode-wire-top .compass{z-index:10;filter:brightness(.95)}.mode-wire-bottom .active-wire{z-index:10;opacity:.6}.mode-wire-bottom .compass{z-index:20;box-shadow:0 15px 30px #0004}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.86rem;gap:4px;padding-right:5px}.line-btn{font-size:.73rem;padding:6px 8px}.content-scroll-area{padding:4px 6px 6px}.simulation-wrapper{min-height:365px}.ui-card{padding:8px 9px}.topic-description{font-size:.84rem}.controls-dock{width:calc(100% - 12px);margin:0 6px 6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));gap:6px}.status-label{font-size:.76rem}.action-btn{font-size:.8rem;padding:9px 3px}}

n()">改變導線位置</button></div></footer></div><script>
let isDown=true,isWireTop=true;function update(){const container=document.getElementById('simContainer'),arrow=document.getElementById('arrow'),needle=document.getElementById('needle'),signTop=document.getElementById('signTop'),signBot=document.getElementById('signBot'),capTop=document.getElementById('capTop'),capBot=document.getElementById('capBot'),txtCurrent=document.getElementById('txtCurrent'),txtPos=document.getElementById('txtPos'),wireLeft=document.querySelector('.active-wire'),wireTop=document.querySelector('.wire-top'),wireRight=document.querySelector('.wire-right'),wireBottom=document.querySelector('.wire-bottom'),allWires=[wireLeft,wireTop,wireRight,wireBottom];if(isWireTop){container.classList.add('mode-wire-top');container.classList.remove('mode-wire-bottom');txtPos.innerText='導線：在磁針上方';txtPos.style.color='#d35400'}else{container.classList.add('mode-wire-bottom');container.classList.remove('mode-wire-top');txtPos.innerText='導線：在磁針下方';txtPos.style.color='#8e44ad'}allWires.forEach(w=>w.classList.remove('flowing-up','flowing-down','flowing-left','flowing-right'));if(isDown){signTop.innerText='+';signTop.className='bat-text text-plus';signBot.innerText='-';signBot.className='bat-text text-minus';capTop.style.display='block';capBot.style.display='none';arrow.innerText='⬇';txtCurrent.innerText='電流：向下';txtCurrent.style.color='#d35400';wireLeft.classList.add('flowing-down');wireTop.classList.add('flowing-left');wireRight.classList.add('flowing-up');wireBottom.classList.add('flowing-right')}else{signTop.innerText='-';signTop.className='bat-text text-minus';signBot.innerText='+';signBot.className='bat-text text-plus';capTop.style.display='none';capBot.style.display='block';arrow.innerText='⬆';txtCurrent.innerText='電流：向上';txtCurrent.style.color='#8e44ad';wireLeft.classList.add('flowing-up');wireTop.classList.add('flowing-right');wireRight.classList.add('flowing-down');wireBottom.classList.add('flowing-left')}let angle=0;if(isDown)angle=isWireTop?45:-45;else angle=isWireTop?-45:45;needle.style.transform=`rotate(${angle}deg)`}function toggleCurrent(){isDown=!isDown;update()}function togglePosition(){isWireTop=!isWireTop;update()}window.addEventListener('load',update);
</script></body></html>
