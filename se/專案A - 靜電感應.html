<title>晟自然玩科學｜靜電感應</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:'Microsoft JhengHei','Segoe UI',sans-serif;color:var(--ink);background:#f7f7f5}body{display:flex;justify-content:center}.app{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;background:#fff}.main-header{flex:0 0 60px;width:100%;display:flex;align-items:center;padding:0 14px;color:#fff;background:linear-gradient(90deg,#1a2a6c,#b21f1f,#fdbb2d);box-shadow:0 2px 8px #0003;z-index:20}.logo-area{width:40px;height:40px;border-radius:50%;margin-right:12px;background:#fff url('logo.jpg') center/cover;border:2px solid #fff;flex:none}.header-title{flex:1;min-width:0;display:flex;align-items:baseline;white-space:nowrap;overflow:hidden}.brand{font-weight:800;font-size:1rem}.divider{margin:0 3px;opacity:.9}.module{font-size:.94rem;font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{margin-left:8px;background:#06c755;color:#fff;text-decoration:none;padding:6px 11px;border-radius:18px;font-size:.78rem;font-weight:700;white-space:nowrap;box-shadow:0 2px 5px #0002}.content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#fff,#fafcfb)}.simulation-container{flex:1;min-height:0;width:100%;position:relative;background:rgba(255,255,255,.35);overflow:hidden}.simulation-container canvas{display:block;width:100%;height:100%;touch-action:none}.message-card{flex:none;margin:10px 12px 0;padding:11px 14px;border:1px solid var(--subject-line);border-left:5px solid var(--subject-deep);border-radius:12px;background:var(--subject-soft);box-shadow:0 2px 8px #0000000d;font-size:.92rem;font-weight:650;line-height:1.45;text-align:center}.message-card.active{color:#a63d32;border-color:#e7b7af;border-left-color:#d56c5d;background:#fff7f5}.controls-dock{flex:none;margin:10px 12px calc(10px + env(safe-area-inset-bottom));padding:10px 12px;border:1px solid var(--subject-line);border-radiu </style></head>
<body><div class="app">
<header class="main-header"><a href="index.html" class="logo-area" title="返回靜電實驗大廳"></a><div class="header-title"><span class="brand">晟自然玩科學</span><span class="divider">｜</span><span class="module">靜電感應</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header>
<main class="content"><div class="simulation-container" id="sim-container"><canvas id="simCanvas"></canvas></div><div class="message-card" id="infoTag">拖曳帶電棒靠近導體，觀察電子移動狀況</div></main>
<footer class="controls-dock"><div class="switch-capsule"><span class="deck-label">帶電棒</span><button class="btn-toggle active-neg" id="btnNeg" onclick="APP.setRod(-1)">－</button><div class="control-divider"></div><button class="btn-toggle" id="btnPos" onclick="APP.setRod(1)">＋</button></div></footer>
</div><script>
const APP={canvas:null,ctx:null,wrapper:null,width:0,height:0,dpr:1,conductor:{x:0,y:0,r:0},rod:{x:0,y:0,charge:-1,dragging:false,angle:0},particles:[],protons:[],CONFIG:{radiusBase:90,particleSize:15,k_rod:150000,k_self:7000,k_core:0,damping:.6,rodLen:100,rodW:34,gap:50,inductionThreshold:160},state:{inductionLevel:0},
init(){this.wrapper=document.getElementById('sim-container');this.canvas=document.getElementById('simCanvas');if(!this.wrapper||!this.canvas)return;this.ctx=this.canvas.getContext('2d');this.dpr=window.devicePixelRatio||1;const bind=(es,h)=>es.forEach(e=>this.canvas.addEventListener(e,h,{passive:false}));bind(['mousedown','mousemove','mouseup','mouseleave'],e=>this.handleMouse(e));bind(['touchstart','touchmove','touchend'],e=>this.handleTouch(e));window.addEventListener('resize',()=>this.resize());this.resize();this.loop()},
resize(){const r=this.wrapper.getBoundingClientRect();this.width=r.width;this.height=r.height;this.canvas.width=this.width*this.dpr;this.canvas.height=this.height*this.dpr;this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);this.conductor.x=this.width/2;this.conductor.y=this.height/2;let s=Math.min(this.width,this.height)/450;this.conductor.r=this.CONFIG.radiusBase*s;this.rodSize={L:this.CONFIG.rodLen*s,W:this.CONFIG.rodW*s};this.initParticles();if(this.rod.x===0||this.rod.x>this.width||this.rod.y>this.height){this.rod.x=this.width*.85;this.rod.y=this.height*.85}},
initParticles(){this.particles=[];this.protons=[];const{x,y,r}=this.conductor,o=r*.45,pos=[{x:x-o,y:y-o},{x:x+o,y:y-o},{x:x-o,y:y+o},{x:x+o,y:y+o}];pos.forEach(p=>{this.protons.push({x:p.x,y:p.y});this.particles.push({x:p.x+(Math.random()-.5)*10,y:p.y+(Math.random()-.5)*10,vx:0,vy:0})})},
update(){let dxR=this.conductor.x-this.rod.x,dyR=this.conductor.y-this.rod.y;this.rod.angle=Math.atan2(dyR,dxR);let half=this.rodSize.L/2,tipX=this.rod.x+Math.cos(this.rod.angle)*half,tipY=this.rod.y+Math.sin(this.rod.angle)*half,distC=Math.sqrt(dxR*dxR+dyR*dyR),surface=distC-this.conductor.r-half,max=this.CONFIG.inductionThreshold;if(surface<0)surface=0;this.state.inductionLevel=surface>max?0:1-surface/max;const active=this.state.inductionLevel>0,tag=document.getElementById('infoTag');if(tag){if(active){tag.innerText='⚡ 靜電感應：不接觸，使正、負電荷暫時分離';tag.classList.add('active')}else{tag.innerText='拖曳帶電棒靠近導體，觀察電子移動狀況';tag.classList.remove('active')}}const pR=this.CONFIG.particleSize,s=Math.min(this.width,this.height)/450;this.particles.forEach((p,i)=>{let fx=0,fy=0,dx=p.x-tipX,dy=p.y-tipY,d2=dx*dx+dy*dy;if(d2<100)d2=100;let repel=this.rod.charge===-1,rodF=this.CONFIG.k_rod*s/d2,d=Math.sqrt(d2);if(!active)rodF=0;if(repel){fx+=dx/d*rodF;fy+=dy/d*rodF}else{fx-=dx/d*rodF;fy-=dy/d*rodF}this.particles.forEach((o,j)=>{if(i===j)return;let ox=p.x-o.x,oy=p.y-o.y,od2=ox*ox+oy*oy,od=Math.sqrt(od2);if(od<1)od=1;let f=this.CONFIG.k_self*s/od2;fx+=ox/od*f;fy+=oy/od*f});p.vx=(p.vx+fx)*this.CONFIG.damping;p.vy=(p.vy+fy)*this.CONFIG.damping;if(Math.abs(p.vx)<.1)p.vx=0;if(Math.abs(p.vy)<.1)p.vy=0;let nx=p.x+p.vx,ny=p.y+p.vy,cx=nx-this.conductor.x,cy=ny-this.conductor.y,cd=Math.sqrt(cx*cx+cy*cy),limit=this.conductor.r-pR-2;if(cd>limit){let a=Math.atan2(cy,cx);p.x=this.conductor.x+limit*Math.cos(a);p.y=this.conductor.y+limit*Math.sin(a);p.vx=p.vy=0}else{p.x=nx;p.y=ny}this.particles.forEach((o,j)=>{if(i===j)return;let x=p.x-o.x,y=p.y-o.y,d=Math.sqrt(x*x+y*y),min=pR*2+1;if(d<min&&d>0){let push=(min-d)*.5;p.x+=x/d*push;p.y+=y/d*push}})})},
draw(){this.ctx.clearRect(0,0,this.width,this.height);this.drawConductor();this.protons.forEach(p=>this.drawCharge(p.x,p.y,'#e74c3c','+'));this.particles.forEach(p=>this.drawCharge(p.x,p.y,'#3498db','-'));this.drawRod()},
drawConductor(){const{x,y,r}=this.conductor,c=this.ctx;c.fillStyle='#95a5a6';c.fillRect(x-8,y+r-2,16,this.height);c.beginPath();c.arc(x,y,r,0,Math.PI*2);let g=c.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#f8f9fa');g.addColorStop(1,'#95a5a6');c.fillStyle=g;c.fill();if(this.state.inductionLevel>0){let op=this.state.inductionLevel*.3,a=Math.atan2(this.rod.y-y,this.rod.x-x),pos=`rgba(231,76,60,${op})`,neg=`rgba(52,152,219,${op})`,near=this.rod.charge<0?pos:neg,far=this.rod.charge<0?neg:pos;c.save();c.beginPath();c.arc(x,y,r,a-Math.PI/2,a+Math.PI/2);c.fillStyle=near;c.fill();c.beginPath();c.arc(x,y,r,a+Math.PI/2,a+Math.PI*1.5);c.fillStyle=far;c.fill();c.restore();if(this.state.inductionLevel>.1){c.save();let nearC=this.rod.charge<0?'#c0392b':'#2980b9',farC=this.rod.charge<0?'#2980b9':'#c0392b',nearT=this.rod.charge<0?'異性電(+)':'異性電(-)',farT=this.rod.charge<0?'同性電(-)':'同性電(+)',ld=r+35,off=Math.PI/6,nx=x+Math.cos(a-off)*ld,ny=y+Math.sin(a-off)*ld,fx=x+Math.cos(a+Math.PI-off)*ld,fy=y+Math.sin(a+Math.PI-off)*ld;c.globalAlpha=Math.min(1,this.state.inductionLevel*2);c.font='bold 15px Microsoft JhengHei,Arial';c.textAlign='center';c.textBaseline='middle';c.shadowColor='rgba(255,255,255,.8)';c.shadowBlur=4;c.fillStyle=nearC;c.fillText(nearT,nx,ny);c.fillStyle=farC;c.fillText(farT,fx,fy);c.restore()}}c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.lineWidth=2;c.strokeStyle='#bdc3c7';c.stroke()},
drawCharge(x,y,color,symbol){const s=Math.min(this.width,this.height)/450,r=this.CONFIG.particleSize*s,c=this.ctx;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle=color;c.stroke();c.fillStyle=color;c.font=`bold ${r*1.2}px Arial`;c.textAlign='center';c.textBaseline='middle';c.fillText(symbol,x,y+1)},
drawRod(){const c=this.ctx;c.save();c.translate(this.rod.x,this.rod.y);c.rotate(this.rod.angle);const L=this.rodSize.L,W=this.rodSize.W,color=this.rod.charge<0?'#3498db':'#e74c3c',symbol=this.rod.charge<0?'-':'+';c.fillStyle=this.rod.charge<0?'#34495e':'rgba(236,240,241,.95)';c.beginPath();c.roundRect(-L/2,-W/2,L,W,W/2);c.fill();c.strokeStyle='#bdc3c7';c.lineWidth=1;c.stroke();const hx=L/2-W/2,hr=W*.8;c.beginPath();c.arc(hx,0,hr,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=color;c.lineWidth=4;c.stroke();c.fillStyle=color;c.font='bold 28px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(symbol,hx,2);c.fillStyle='#2c3e50';c.fillRect(-L/2,-W/2,40,W);c.strokeStyle='#555';c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-L/2+10+i*10,-W/2);c.lineTo(-L/2+10+i*10,W/2);c.stroke()}c.restore()},
getPos(e){const r=this.canvas.getBoundingClientRect();let x,y;if(e.touches&&e.touches.length){x=e.touches[0].clientX;y=e.touches[0].clientY}else if(e.clientX!==undefined){x=e.clientX;y=e.clientY}else return{x:this.rod.x,y:this.rod.y};return{x:x-r.left,y:y-r.top}},handleMouse(e){if(e.type==='mousedown')this.startDrag(e);else if(e.type==='mousemove')this.drag(e);else this.endDrag()},handleTouch(e){e.preventDefault();if(e.type==='touchstart')this.startDrag(e);else if(e.type==='touchmove')this.drag(e);else this.endDrag()},startDrag(e){let p=this.getPos(e),d=Math.hypot(p.x-this.rod.x,p.y-this.rod.y);if(d<150){this.rod.dragging=true;this.updateRodPos(p.x,p.y)}},drag(e){if(!this.rod.dragging)return;let p=this.getPos(e);this.updateRodPos(p.x,p.y)},endDrag(){this.rod.dragging=false},
updateRodPos(tx,ty){let dx=this.conductor.x-tx,dy=this.conductor.y-ty,a=Math.atan2(dy,dx),half=this.rodSize.L/2,tipX=tx+Math.cos(a)*half,tipY=ty+Math.sin(a)*half;tipX=Math.max(0,Math.min(this.width,tipX));tipY=Math.max(0,Math.min(this.height,tipY));this.rod.x=tipX-Math.cos(a)*half;this.rod.y=tipY-Math.sin(a)*half;let fx=this.conductor.x-this.rod.x,fy=this.conductor.y-this.rod.y,d=Math.hypot(fx,fy),min=half+this.conductor.r+this.CONFIG.gap;if(d<min){this.rod.x=this.conductor.x-Math.cos(a)*min;this.rod.y=this.conductor.y-Math.sin(a)*min}},setRod(c){this.rod.charge=c;document.getElementById('btnNeg').className=c===-1?'btn-toggle active-neg':'btn-toggle';document.getElementById('btnPos').className=c===1?'btn-toggle active-pos':'btn-toggle'},loop(){this.update();this.draw();requestAnimationFrame(()=>this.loop())}};window.onload=()=>APP.init();
</script></body></html>
