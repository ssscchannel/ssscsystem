<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>晟自然玩科學｜感應起電</title>
<style>

</style></head><body><div class="app"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand">晟自然玩科學</span><span class="title-divider">｜</span><span class="module">感應起電</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><main class="content"><div class="simulation-container" id="sim-container"><canvas id="simCanvas"></canvas></div><div class="message-card step-active" id="infoTag">步驟1：請拖曳帶電棒靠近金屬球</div></main><footer class="controls-dock"><div class="switch-capsule"><span class="deck-label">帶電棒</span><button class="btn-toggle active-neg" id="btnNeg" onclick="APP.setRod(-1)">－</button><button class="btn-toggle" id="btnPos" onclick="APP.setRod(1)">＋</button><div class="control-divider"></div><button class="btn-toggle" id="btnGround" onclick="APP.toggleGround()" title="接地">🖐</button><button class="btn-toggle btn-reset" onclick="APP.reset()" title="重置">↺</button></div></footer></div>
<script>
const APP={canvas:null,ctx:null,wrapper:null,width:0,height:0,dpr:1,conductor:{x:0,y:0,r:0},rod:{x:0,y:0,charge:-1,dragging:false,angle:0},particles:[],protons:[],flowParticles:[],state:{inductionLevel:0,isGrounded:false,flowTimer:0},CONFIG:{radiusBase:90,particleSize:15,k_rod:120000,k_self:8000,damping:.85,rodLen:100,rodW:34,gap:50,inductionThreshold:160,groundY:0,wireX:0},init(){this.wrapper=document.getElementById('sim-container');this.canvas=document.getElementById('simCanvas');this.ctx=this.canvas.getContext('2d');this.dpr=window.devicePixelRatio||1;const bind=(es,h)=>es.forEach(e=>this.canvas.addEventListener(e,h,{passive:false}));bind(['mousedown','mousemove','mouseup','mouseleave'],e=>this.handleMouse(e));bind(['touchstart','touchmove','touchend'],e=>this.handleTouch(e));window.addEventListener('resize',()=>this.resize());this.resize();this.loop()},resize(){const r=this.wrapper.getBoundingClientRect();this.width=r.width;this.height=r.height;this.canvas.width=this.width*this.dpr;this.canvas.height=this.height*this.dpr;this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);this.conductor.x=this.width/2;this.conductor.y=this.height/2-30;this.CONFIG.groundY=this.height-35;let s=Math.min(this.width,this.height)/400;this.conductor.r=this.CONFIG.radiusBase*s;this.CONFIG.wireX=this.conductor.x+this.conductor.r+30;this.rodSize={L:this.CONFIG.rodLen*s,W:this.CONFIG.rodW*s};if(!this.protons.length){this.initParticles();this.rod.x=this.width*.85;this.rod.y=this.height*.82}else{if(this.rod.x>this.width)this.rod.x=this.width-50;if(this.rod.y>this.height)this.rod.y=this.height-50}},reset(){this.state.isGrounded=false;this.state.flowTimer=0;this.flowParticles=[];this.rod.x=this.width*.85;this.rod.y=this.height*.82;this.rod.angle=-Math.PI/4;this.initParticles();this.updateUI()},initParticles(){this.particles=[];this.protons=[];const{x,y,r}=this.conductor,o=r*.4,p=[{x:x-o,y:y-o},{x:x+o,y:y-o},{x:x-o,y:y+o},{x:x+o,y:y+o}];p.forEach(q=>{this.protons.push({x:q.x,y:q.y});this.particles.push({x:q.x+(Math.random()-.5)*5,y:q.y+(Math.random()-.5)*5,vx:0,vy:0})})},update(){let dx=this.conductor.x-this.rod.x,dy=this.conductor.y-this.rod.y;this.rod.angle=Math.atan2(dy,dx);let h=this.rodSize.L/2,tx=this.rod.x+Math.cos(this.rod.angle)*h,ty=this.rod.y+Math.sin(this.rod.angle)*h,d=Math.hypot(dx,dy)-this.conductor.r-h;d=Math.max(0,d);this.state.inductionLevel=d>this.CONFIG.inductionThreshold?0:1-d/this.CONFIG.inductionThreshold;this.updateGroundingLogic();const s=this.width/400,pr=this.CONFIG.particleSize*s,rf=this.CONFIG.k_rod*s*(this.rod.charge===1?2.5:1),sf=this.CONFIG.k_self*s;this.particles.forEach(p=>{let fx=0,fy=0,x=p.x-tx,y=p.y-ty,ds=x*x+y*y,min=this.rod.charge===1?60:100;ds=Math.max(ds,min);let f=rf/ds,dd=Math.sqrt(ds);if(this.state.inductionLevel>0){if(this.rod.charge===-1){fx+=x/dd*f;fy+=y/dd*f}else{fx-=x/dd*f;fy-=y/dd*f}}this.particles.forEach(o=>{if(p===o)return;let x=p.x-o.x,y=p.y-o.y,d2=x*x+y*y,di=Math.max(.1,Math.sqrt(d2)),f2=sf/(d2+10);fx+=x/di*f2;fy+=y/di*f2});p.vx=(p.vx+fx)*this.CONFIG.damping;p.vy=(p.vy+fy)*this.CONFIG.damping;let sp=Math.hypot(p.vx,p.vy);if(sp>8){p.vx=p.vx/sp*8;p.vy=p.vy/sp*8}p.x+=p.vx;p.y+=p.vy});for(let k=0;k<3;k++)this.particles.forEach((p,i)=>{let x=p.x-this.conductor.x,y=p.y-this.conductor.y,d=Math.hypot(x,y),lim=this.conductor.r-pr-2;if(d>lim){let a=Math.atan2(y,x);p.x=this.conductor.x+lim*Math.cos(a);p.y=this.conductor.y+lim*Math.sin(a);p.vx*=.1;p.vy*=.1}for(let j=i+1;j<this.particles.length;j++){let q=this.particles[j],x=p.x-q.x,y=p.y-q.y,d=Math.hypot(x,y),m=pr*2+2;if(d<m&&d>0){let ov=m-d,nx=x/d,ny=y/d;p.x+=nx*ov*.5;p.y+=ny*ov*.5;q.x-=nx*ov*.5;q.y-=ny*ov*.5}}});this.updateFlowParticles();this.updateInstruction()},updateGroundingLogic(){if(!this.state.isGrounded||this.state.inductionLevel<.2)return;if(++this.state.flowTimer<10)return;let n=this.particles.length,t=this.rod.charge===1?8:0;if(n<t&&!this.flowParticles.length){this.spawnFlowParticle('up');this.state.flowTimer=0}else if(n>t&&!this.flowParticles.length){ width;i+=25){this.ctx.moveTo(i,y);this.ctx.lineTo(i-15,y+15)}this.ctx.strokeStyle='#95a5a6';this.ctx.lineWidth=1;this.ctx.stroke()},drawGroundSystem(){let y=this.CONFIG.groundY,w=this.CONFIG.wireX,{x,r}=this.conductor,cy=this.conductor.y;this.ctx.lineCap='round';this.ctx.beginPath();this.ctx.moveTo(x+r+20,cy);this.ctx.lineTo(w,cy);this.ctx.lineTo(w,y);this.ctx.strokeStyle='#111';this.ctx.lineWidth=4;this.ctx.stroke();[[0,15,0,0],[-18,15,18,15],[-12,22,12,22],[-6,29,6,29]].forEach(a=>{this.ctx.beginPath();this.ctx.moveTo(w+a[0],y+a[1]);this.ctx.lineTo(w+a[2],y+a[3]);this.ctx.stroke()});this.ctx.save();this.ctx.font='40px Arial';this.ctx.textAlign='center';this.ctx.translate(x+r+15,cy+15);this.ctx.rotate(-1.57);this.ctx.fillText('👆',0,0);this.ctx.restore();let chars=this.rod.charge===1?['電','子','從','地','球','流','入']:['電','子','從','金','屬','球','流','出'],arrow=this.rod.charge===1?'↑':'↓',center=(y+cy)/2,start=center-chars.length*14;this.ctx.fillStyle='#2c3e50';this.ctx.font="bold 20px 'Microsoft JhengHei'";this.ctx.textAlign='center';chars.forEach((ch,i)=>this.ctx.fillText(ch,w-42,start+i*25));this.ctx.fillStyle='#e74c3c';this.ctx.font='bold 34px Arial';this.ctx.fillText(arrow,w+36,center)},drawConductor(){const{x,y,r}=this.conductor;this.ctx.fillStyle='#5d4037';this.ctx.fillRect(x-40,this.CONFIG.groundY-15,80,15);this.ctx.fillStyle='#95a5a6';this.ctx.fillRect(x-8,y+r-2,16,this.CONFIG.groundY-15-(y+r)+2);this.ctx.beginPath();this.ctx.arc(x,y,r,0,Math.PI*2);let g=this.ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#f8f9fa');g.addColorStop(1,'#95a5a6');this.ctx.fillStyle=g;this.ctx.fill();this.ctx.strokeStyle='#bdc3c7';this.ctx.lineWidth=2;this.ctx.stroke()},drawCharge(x,y,color,sym){let r=this.CONFIG.particleSize*(this.width/400);this.ctx.beginPath();this.ctx.arc(x,y,r,0,Math.PI*2);this.ctx.fillStyle='#fff';this.ctx.fill();this.ctx.strokeStyle=color;this.ctx.lineWidth=2;this.ctx.stroke();this.ctx.fillStyle=color;this.ctx.font=`bold ${r*1.2}px Arial`;thi
