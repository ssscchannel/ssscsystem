</div></div></main><footer class="controls-dock" id="controls-area"><button class="scene-btn active" onclick="switchScene('bulb-series',this)">燈泡串聯</button><button class="scene-btn" onclick="switchScene('bulb-parallel',this)">燈泡並聯</button><button class="scene-btn" onclick="switchScene('bat-series',this)">電池串聯</button><button class="scene-btn" onclick="switchScene('bat-parallel',this)">電池並聯</button><button class="scene-btn" onclick="switchScene('mixed-1',this)">進階：二串並一</button><button class="scene-btn" onclick="switchScene('mixed-2',this)">進階：二並串一</button></footer></div><script>
let currentMode='bulb-series';let brokenState={'b1-s':false,'b2-s':false,'b1-p':false,'b2-p':false};let batteryDead={'bat1-s':false,'bat2-s':false,'bat1-p':false,'bat2-p':false};let brokenStateMixed={'b1-m1':false,'b2-m1':false,'b3-m1':false,'b1-m2':false,'b2-m2':false,'b3-m2':false};let batteryDeadMixed={'bat-m1':false,'bat-m2':false};window.addEventListener('DOMContentLoaded',()=>{switchScene('bulb-series',document.querySelector('.scene-btn'));autoFitCircuit()});window.addEventListener('resize',autoFitCircuit);function autoFitCircuit(){const board=document.getElementById('circuit-board'),container=document.getElementById('sim-container'),logicalWidth=500,logicalHeight=450,availableWidth=container.clientWidth-20;let scale=Math.min(availableWidth/logicalWidth,1);board.style.transform=`scale(${scale})`;container.style.height=`${logicalHeight*scale}px`;container.style.minHeight=`${logicalHeight*scale}px`}function switchScene(mode,btn){currentMode=mode;document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.querySelectorAll('.circuit-scene').forEach(s=>s.classList.remove('active'));document.getElementById('scene-'+mode).classList.add('active');updateCircuit()}function toggleBulb(id){if(id in brokenStateMixed){brokenStateMixed[id]=!brokenStateMixed[id];document.getElementById(id).classList.toggle('broken',brokenStateMixed[id])}else{brokenState[id]=!brokenState[id];document.getElementById(id).classList.toggle('broken',brokenState[id])}updateCircuit()}function toggleBattery(id){if(id in batteryDeadMixed){batteryDeadMixed[id]=!batteryDeadMixed[id];document.getElementById(id).classList.toggle('battery-dead',batteryDeadMixed[id])}else{batteryDead[id]=!batteryDead[id];document.getElementById(id).classList.toggle('battery-dead',batteryDead[id])}updateCircuit()}function updateCircuit(){document.querySelectorAll('.bulb-wrapper').forEach(b=>b.classList.remove('lit-normal','lit-dim','lit-bright'));let d={title:'',bright:'',desc:'',color:''};if(currentMode==='bulb-series'){d.title='燈泡串聯';const b1=brokenState['b1-s'],b2=brokenState['b2-s'];if(!b1&&!b2){document.getElementById('b1-s').classList.add('lit-dim');document.getElementById('b2-s').classList.add('lit-dim');d.bright='亮度：較暗';d.desc='燈泡亮度較暗，因為能量被兩個燈泡平分了。';d.color='#cca300'}else{d.bright='斷路';d.desc='因為只有一條路，一個燈泡熄滅，全部跟著熄滅。';d.color='#7f8c8d'}}else if(currentMode==='bulb-parallel'){d.title='燈泡並聯';const b1=brokenState['b1-p'],b2=brokenState['b2-p'];if(!b1)document.getElementById('b1-p').classList.add('lit-normal');if(!b2)document.getElementById('b2-p').classList.add('lit-normal');if(b1&&b2){d.bright='斷路';d.desc='兩顆燈泡都熄滅了，沒有任何通路，全都不亮。';d.color='#7f8c8d'}else{d.bright='亮度：普通';d.color='#f39c12';let t='各燈泡都是獨立電路，互不影響。';if(b1&&!b2)t='上方熄滅，下方依然會亮，亮度不變！互不影響。';if(!b1&&b2)t='下方熄滅，上方依然會亮，亮度不變！互不影響。';d.desc=t}}else if(currentMode==='bat-series'){d.title='電池串聯';if(batteryDead['bat1-s']||batteryDead['bat2-s']){d.bright='斷路';d.desc='當一顆電池沒電，電流會變得非常微弱，燈泡熄滅。';d.color='#7f8c8d'}else{document.getElementById('b1-bs').classList.add('lit-bright');d.bright='亮度：超亮';d.desc='兩顆電池串聯，電壓相加，燈泡超級亮！';d.color='#e74c3c'}}else if(currentMode==='bat-parallel'){d.title='電池並聯';let a=0;if(!batteryDead['bat1-p'])a++;if(!batteryDead['bat2-p'])a++;if(a>0){document.getElementById('b1-bp').classList.add('lit-normal');d.bright='亮度：普通';d.color='#f39c12';d.desc=a===2?'電池並聯，電壓不變，亮度和一顆電池相同。':'一顆沒電，另一顆還在供電，亮度維持不變！'}else{d.bright='斷路';d.desc='兩顆電池都沒電了，燈泡熄滅。';d.color='#7f8c8d'}}else if(currentMode==='mixed-1'){d.title='二串並一';const bat=batteryDeadMixed['bat-m1'],b1=brokenStateMixed['b1-m1'],b2=brokenStateMixed['b2-m1'],b3=brokenStateMixed['b3-m1'];if(bat){d.bright='斷路';d.desc='電池沒電了。';d.color='#7f8c8d'}else{let m=[];if(!b1&&!b2){document.getElementById('b1-m1').classList.add('lit-dim');document.getElementById('b2-m1').classList.add('lit-dim');m.push('ＡＢ串聯(較暗)')}else m.push('ＡＢ斷路');if(!b3){document.getElementById('b3-m1').classList.add('lit-bright');m.push('Ｃ獨立(超亮)')}else m.push('Ｃ斷路');if((b1||b2)&&b3){d.bright='斷路';d.desc='兩條支路都不通，全滅。';d.color='#7f8c8d'}else{d.bright='混合亮度';d.color='#9b59b6';d.desc='兩條並聯互不影響。'+m.join('，')+'。'}}}else if(currentMode==='mixed-2'){d.title='二並串一';const bat=batteryDeadMixed['bat-m2'],main=brokenStateMixed['b3-m2'],b1=brokenStateMixed['b1-m2'],b2=brokenStateMixed['b2-m2'];if(bat){d.bright='斷路';d.desc='電池沒電了。';d.color='#7f8c8d'}else if(main){d.bright='斷路';d.desc='Ａ燈泡有問題，造成整個電路斷電。';d.color='#7f8c8d'}else{let o1=!b1,o2=!b2;if(o1&&o2){document.getElementById('b3-m2').classList.add('lit-bright');document.getElementById('b1-m2').classList.add('lit-dim');document.getElementById('b2-m2').classList.add('lit-dim');d.bright='A最亮，BC暗';d.color='#e74c3c';d.desc='全亮時，Ａ承受總電流，ＢＣ並聯電流平分。'}else if(!o1&&!o2){d.bright='斷路';d.desc='ＢＣ全部壞了，迴路不通。';d.color='#7f8c8d'}else{document.getElementById('b3-m2').classList.add('lit-normal');if(o1)document.getElementById('b1-m2').classList.add('lit-normal');if(o2)document.getElementById('b2-m2').classList.add('lit-normal');d.bright='亮度：普通';d.color='#f39c12';d.desc='少了Ｂ或Ｃ，變成２燈泡串聯。總電阻變大，Ａ變暗！另一顆沒壞的則變亮。'}}}updateDashboard(d)}function updateDashboard(d){document.getElementById('infoTitle').innerText=d.title;const badge=document.getElementById('infoBrightness');badge.innerText=d.bright;badge.style.backgroundColor=d.color;document.getElementById('infoText').innerText=d.desc}
</script></body></html>
