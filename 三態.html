<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>晟自然玩科學｜三態變化</title><style>
:root{--subject:#efb07a;--subject-deep:#c9783d;--subject-soft:#fff4e8;--subject-line:#f2d2b4;--ink:#3f3f46}*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:'Microsoft JhengHei','Segoe UI',sans-serif;color:#333;background:url('page.jpg') center/cover;user-select:none;-webkit-user-select:none}body{display:flex;justify-content:center}.app-layout-wrapper{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.9)}.main-header{flex:0 0 60px;min-height:60px;width:100%;background:linear-gradient(90deg,#1a2a6c,#b21f1f,#fdbb2d);box-shadow:0 2px 8px #0003;z-index:100;display:flex;align-items:center;padding:0 15px;color:#fff}.logo-area{width:40px;height:40px;border-radius:50%;margin-right:14px;background:#fff url('logo.jpg') center/cover;border:2px solid #00d2ff;flex-shrink:0}.header-title{min-width:0;display:flex;align-items:center;flex-wrap:nowrap;gap:7px;flex:1;font-size:1rem;line-height:1;white-space:nowrap;overflow:hidden;text-shadow:1px 1px 2px #0005;padding-right:10px}.brand-name{font-weight:900;flex-shrink:0}.title-divider{opacity:.65}.module-name{font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{margin-left:auto;flex-shrink:0;background:#00B900;color:#fff;text-decoration:none;padding:6px 11px;border-radius:20px;font-size:.82rem;line-height:1;font-weight:bold;border:1px solid #ffffff80}.content-scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;width:100%;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center}.simulation-container{order:1;width:min(100%,460px);aspect-ratio:1/1;background:#f0f4f8;border-radius:12px;position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 0 10px #00000018;border:1px solid #ddd;flex:0 1 auto;min-height:0}canvas{width:100%;height:100%;display:block}.thermometer-display{position:absolute;top:10px;left:10px;background:#fffffff0;padding:5px 12px;border-radius:20px;font-family:monospace;font-size:1.2rem;font-weight:bold;border:1px solid #ccc;pointer-events:none;display:flex;align-items:center;gap:5px;box-shadow:0 2px 5px #00000018;z-index:5}.ui-card{order:2;width:100%;margin:9px 0 0;background:#fffffff7;border:1.5px solid var(--subject-line);border-left:5px solid var(--subject);border-radius:14px;box-shadow:0 3px 12px rgba(100,65,35,.10);padding:9px 12px}.topic-description{text-align:center;color:#555;font-size:.88rem;line-height:1.45}.controls-dock{flex:0 0 auto;width:calc(100% - 20px);margin:0 10px 8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff9;border:1.5px solid var(--subject-line);border-radius:14px;box-shadow:0 -2px 12px rgba(100,65,35,.08),0 3px 12px rgba(100,65,35,.08);z-index:100;display:flex;flex-direction:column;align-items:center;gap:9px}.state-btn-group{display:flex;gap:8px;width:100%}.state-btn{flex:1;padding:9px 0;border:1.5px solid var(--subject-line);border-radius:9px;font-size:.95rem;font-weight:bold;cursor:default;transition:.2s;display:flex;justify-content:center;align-items:center;gap:5px;background:#fff;color:#666}.state-btn span{font-size:1.15rem}.state-btn.active{background:var(--subject-soft);color:var(--subject-deep);border-color:var(--subject);box-shadow:0 2px 5px rgba(100,65,35,.12)}.lever-wrapper{width:100%;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#6aaee8 0%,#fff 50%,#ef7f68 100%);padding:9px 14px;border-radius:30px;border:1px solid var(--subject-line);position:relative}.lever-label{font-size:1.15rem;width:24px;text-align:center}input[type=range]{flex:1;-webkit-appearance:none;background:transparent;z-index:2;margin:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:26px;width:26px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 4px #0005;margin-top:-11px;border:3px solid var(--subject-deep)}input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;cursor:pointer;background:#0002;border-radius:2px}.hint-text{text-align:center;font-size:.78rem;color:#777;margin-top:-3px}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.88rem;gap:4px;padding-right:6px}.line-btn{font-size:.74rem;padding:6px 8px}.content-scroll-area{padding:6px}.simulation-container{width:min(100%,390px)}.ui-card{margin-top:7px;padding:8px 9px}.topic-description{font-size:.82rem}.controls-dock{width:calc(100% - 12px);margin:0 6px 6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));gap:7px}.state-btn{padding:7px 0;font-size:.88rem}.lever-wrapper{padding:7px 10px}}
</style></head><body><div class="app-layout-wrapper"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">三態變化</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><main class="content-scroll-area"><div class="simulation-container" id="sim-container"><canvas id="simCanvas"></canvas><div class="thermometer-display"><span>🌡️</span><span id="tempValue">25</span>°C</div></div><div class="ui-card topic-description">觀察水分子在不同溫度下的排列與運動狀態。試著改變溫度，看看固態、液態與氣態有什麼不同。</div></main><footer class="controls-dock"><div class="state-btn-group"><button class="state-btn" data-state="solid"><span>🧊</span>固態</button><button class="state-btn active" data-state="liquid"><span>💧</span>液態</button><button class="state-btn" data-state="gas"><span>☁️</span>氣態</button></div><div class="lever-wrapper"><span class="lever-label">❄️</span><input type="range" id="heatLever" min="-273" max="300" value="0" step="1"><span class="lever-label">🔥</span></div><div class="hint-text">左右撥動以調整溫度</div></footer></div><script>
const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const NUM_PARTICLES=120,PARTICLE_RADIUS=12,PADDING=20,CONTAINER_WIDTH=1000,CONTAINER_HEIGHT=1000;let temperature=25,heatPower=0,currentPhase='liquid',scale=1,particles=[];
class Particle{constructor(id){this.id=id;this.reset();this.latticeX=0;this.latticeY=0;this.anchored=false;this.isGas=false;this.baseAngle=Math.random()*Math.PI*2}reset(){this.x=PADDING+Math.random()*(CONTAINER_WIDTH-PADDING*2);this.y=Math.random()*CONTAINER_HEIGHT;this.vx=(Math.random()-.5)*5;this.vy=(Math.random()-.5)*5;this.angle=Math.random()*Math.PI*2;this.vAngle=(Math.random()-.5)*.1;this.radius=PARTICLE_RADIUS}update(dt=1){if(temperature<=0){this.isGas=false;if(!this.anchored){this.vy+=.4*dt;this.vx*=.85;this.vy*=.85;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y>CONTAINER_HEIGHT-PADDING-this.radius){this.anchored=true;this.latticeX=this.x;this.latticeY=this.y}}else{const k=.05,friction=.8,forceX=(this.latticeX-this.x)*k,forceY=(this.latticeY-this.y)*k;this.vx+=forceX;this.vy+=forceY;this.vx*=friction;this.vy*=friction;this.latticeX+=(this.x-this.latticeX)*.02;this.latticeY+=(this.y-this.latticeY)*.02;let tempRatio=Math.max(0,(temperature+273)/273);this.vx+=(Math.random()-.5)*.5*tempRatio;this.vy+=(Math.random()-.5)*.5*tempRatio;this.x+=this.vx;this.y+=this.vy}if(this.x<PADDING){this.x=PADDING;this.vx=0}if(this.x>CONTAINER_WIDTH-PADDING){this.x=CONTAINER_WIDTH-PADDING;this.vx=0}if(this.y>CONTAINER_HEIGHT-PADDING){this.y=CONTAINER_HEIGHT-PADDING;this.vy=0}let tempRatio=Math.max(0,(temperature+273)/273);this.angle=this.baseAngle+(Math.random()-.5)*.2*tempRatio;return}this.anchored=false;if(!this.isGas){let tRatio=Math.max(0,temperature)/100,evapChance=.003*Math.pow(tRatio,4);if(temperature>=100)evapChance=.1;if(Math.random()<evapChance*dt){this.isGas=true;let kickPower=4+8*tRatio;this.vy-=kickPower+Math.random()*5;let spread=2+6*tRatio;this.vx+=(Math.random()-.5)*spread}}else{let condenseChance=0;if(this.y>CONTAINER_HEIGHT-PARTICLE_RADIUS*8&&this.vy>0)condenseChance=.2;if(temperature<50)condenseChance+=.001;if(Math.random()<condenseChance*dt){this.isGas=false;this.vx*=.5;this.vy*=.5}}const speedSq=this.vx*this.vx+this.vy*this.vy;if(this.isGas){this.vy-=.005*dt}else{this.vy+=.4*dt;if(speedSq>2){this.vx*=.99;this.vy*=.99}else{this.vx*=.96;this.vy*=.96}let activity=Math.max(0,temperature)/300;if(temperature>80)activity*=2;this.vx+=(Math.random()-.5)*activity;this.vy+=(Math.random()-.5)*activity}let speedScale=this.isGas?1+Math.max(0,temperature-25)/200:1;this.x+=this.vx*speedScale*dt;this.y+=this.vy*speedScale*dt;this.handleBoundaries();this.angle+=this.vAngle*(this.isGas?2:1)*dt}handleBoundaries(){let wallBounce=this.isGas?1:.4;if(this.x<PADDING){this.x=PADDING;this.vx*=-wallBounce}if(this.x>CONTAINER_WIDTH-PADDING){this.x=CONTAINER_WIDTH-PADDING;this.vx*=-wallBounce}if(this.y>CONTAINER_HEIGHT-PADDING){this.y=CONTAINER_HEIGHT-PADDING;this.vy*=-wallBounce}if(this.y<PADDING){this.y=PADDING;let isBoiling=temperature>=100;if(this.isGas&&!isBoiling){this.isGas=false;this.vy*=-.5;this.vy+=2}else this.vy*=-wallBounce}}draw(ctx){if(isNaN(this.x)||isNaN(this.y))return;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.beginPath();ctx.arc(0,0,this.radius,0,Math.PI*2);ctx.fillStyle=this.isGas?'rgba(255,77,77,1)':'#ff4d4d';ctx.fill();ctx.strokeStyle='#800000';ctx.lineWidth=1.5;ctx.stroke();const hDist=this.radius*1.1,hRad=this.radius*.6,hAngle=2;ctx.beginPath();ctx.arc(Math.cos(-hAngle/2)*hDist,Math.sin(-hAngle/2)*hDist,hRad,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(Math.cos(hAngle/2)*hDist,Math.sin(hAngle/2)*hDist,hRad,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.restore()}}
function init(){particles=[];for(let i=0;i<NUM_PARTICLES;i++)particles.push(new Particle(i));resize();window.addEventListener('resize',resize);requestAnimationFrame(loop);updatePhaseState(true)}function resize(){const container=document.getElementById('sim-container');if(!container)return;const rect=container.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;scale=canvas.width/CONTAINER_WIDTH;ctx.setTransform(1,0,0,1,0,0);ctx.scale(scale,scale)}
function resolveCollisions(){let spacingFactor=3.2;if(temperature<=0)spacingFactor=4;else if(currentPhase==='gas')spacingFactor=3;const minDist=PARTICLE_RADIUS*spacingFactor,minDistSq=minDist*minDist;for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){const p1=particles[i],p2=particles[j],dx=p2.x-p1.x,dy=p2.y-p1.y,distSq=dx*dx+dy*dy;if(distSq<minDistSq&&distSq>0){const dist=Math.sqrt(distSq),nx=dx/dist,ny=dy/dist;let pushStrength=.5;if(temperature<=0)pushStrength=.1;const overlap=(minDist-dist)*pushStrength;p1.x-=nx*overlap;p1.y-=ny*overlap;p2.x+=nx*overlap;p2.y+=ny*overlap;if(temperature<=0)continue;let restitution=.2;if(p1.isGas||p2.isGas)restitution=1;const v1n=p1.vx*nx+p1.vy*ny,v2n=p2.vx*nx+p2.vy*ny;if(v1n<v2n)continue;const impulse=(v2n-v1n)*(1+restitution)*.5;p1.vx+=impulse*nx;p1.vy+=impulse*ny;p2.vx-=impulse*nx;p2.vy-=impulse*ny;if(!p1.isGas&&!p2.isGas){p1.vx*=.99;p1.vy*=.99;p2.vx*=.99;p2.vy*=.99}}}}
function updatePhaseState(forceReset=false){let nextPhase=temperature<=0?'solid':temperature<100?'liquid':'gas';if(nextPhase!==currentPhase||forceReset){currentPhase=nextPhase;document.querySelectorAll('.state-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.state===currentPhase));if(currentPhase==='solid')particles.forEach(p=>p.anchored=false)}}
function loop(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);if(temperature<=0){const alpha=Math.min(.8,Math.abs(temperature)/50);ctx.fillStyle=`rgba(200,230,255,${.3+alpha*.2})`}else if(temperature>=100){const alpha=Math.min(1,(temperature-100)/150);ctx.fillStyle=`rgba(255,210,190,${.15+alpha*.35})`}else ctx.fillStyle='#f8f9fa';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();if(heatPower!==0){let changeRate=.2;if(heatPower<0){let dist=temperature+273,damping=Math.min(1,dist/70)+.05;changeRate*=damping}temperature+=heatPower*changeRate;if(temperature>600)temperature=600;if(temperature<-273)temperature=-273;document.getElementById('tempValue').innerText=Math.round(temperature);updatePhaseState()}const SUB_STEPS=5,subDt=1/SUB_STEPS;for(let s=0;s<SUB_STEPS;s++){particles.forEach(p=>p.update(subDt));for(let k=0;k<2;k++)resolveCollisions()}particles.forEach(p=>p.draw(ctx));requestAnimationFrame(loop)}
const lever=document.getElementById('heatLever');if(lever){lever.addEventListener('input',e=>{heatPower=parseInt(e.target.value)/100});function resetLever(){lever.value=0;heatPower=0}lever.addEventListener('change',resetLever);lever.addEventListener('mouseup',resetLever);lever.addEventListener('touchend',resetLever)}window.setMode=function(mode){switch(mode){case'solid':temperature=-20;break;case'liquid':temperature=25;break;case'gas':temperature=150}if(lever){lever.value=0;heatPower=0}document.getElementById('tempValue').innerText=Math.round(temperature);updatePhaseState(true)};init();
</script></body></html>
