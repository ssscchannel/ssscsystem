solid #d6d6d6;border-radius:6px;font-size:.92rem;background:#fff;text-align:center}.input-box:focus{outline:none;border-color:var(--subject-deep);box-shadow:0 0 0 2px #91cfa633}.inline{flex-direction:row;align-items:center;gap:6px}.inline label{white-space:nowrap}.final-row{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;padding:5px;border-radius:8px;margin-top:2px;font-size:.85rem}.final-row .input-box{width:90px;color:#c33;font-weight:bold}.action-btn{width:100%;padding:10px;border:0;border-radius:9px;background:var(--subject-deep);color:#fff;font-size:1rem;font-weight:bold;cursor:pointer;box-shadow:0 3px 6px #0002}.action-btn:active{transform:scale(.985)}.reset-btn{background:#738079}.math-line{margin:4px 0;padding:6px 8px;border-left:4px solid var(--subject);background:#fff;opacity:0;transform:translateX(-10px);transition:.45s;font-size:.9rem;line-height:1.35;border-radius:0 6px 6px 0}.math-line.show{opacity:1;transform:none}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.88rem;gap:4px;padding-right:6px}.line-btn{font-size:.74rem;padding:6px 8px}.content{padding:5px 6px 7px}.simulation-container{height:220px}.beaker{width:80px;height:124px}.beaker-group{gap:30px;padding-bottom:25px}.label-temp{font-size:.94rem;top:-29px}#mix-beaker{width:116px;height:164px;margin-bottom:15px}.info-container{padding:7px 8px}.controls{width:calc(100% - 12px);margin:0 6px 6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));gap:6px}.settings{padding:7px}.mode-row{margin-bottom:5px}.input-box{height:29px;font-size:.86rem}.input-group label{font-size:.72rem}.action-btn{padding:8px}.params-grid{gap:6px}}
</style></head><body><div class="app"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">熱平衡</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><main class="content"><div class="simulation-container" id="sim-container"><div id="view-liquid" class="view-layer active"><div class="beaker-group" id="initial-group"><div class="beaker"><div class="label-temp" id="disp-t1">20°C</div><div class="water" id="water-1" style="height:40%;background:#4d79ff"></div></div><div class="beaker"><div class="label-temp" id="disp-t2">80°C</div><div class="water" id="water-2" style="height:40%;background:#ff4d4d"></div></div></div><div class="beaker" id="mix-beaker"><div class="label-temp" id="disp-mix">--°C</div><div class="water" id="water-mix" style="height:0%;background:#a64dff;transition:height 1s,background 1s"></div></div></div><canvas id="simCanvas" class="view-layer"></canvas></div><div class="info-container" id="math-board"><div class="intro">設定參數後按下「開始混合」，觀察熱量交換與平衡結果。</div></div></main><footer class="controls"><div class="settings"><div class="mode-row"><div class="mode-btn active" id="mode-liquid">液體混合</div><div class="mode-btn" id="mode-solid">固體投入</div></div><div class="params-grid"><div><div class="param-head cold" id="lbl-obj1">液體 (A)</div><div class="param-row"><div class="input-group"><label>質量(g)</label><input type="number" id="m1" class="input-box" value="100"></div><div class="input-group"><label>初溫(°C)</label><input type="number" id="t1" class="input-box" value="20"></div></div><div class="input-group inline"><label>比熱</label><input type="number" id="s1" class="input-box" value="1"></div></div><div><div class="param-head hot" id="lbl-obj2">液體 (B)</div><div class="param-row"><div class="input-group"><label>質量(g)</label><input type="number" id="m2" class="input-box" value="100"></div><div class="input-group"><label>初溫(°C)</label><input type="number" id="t2" class="input-box" value="80"></div></div><div class="input-group inline"><label>比熱</label><input type="number" id="s2" class="input-box" value="1"></div></div></div><div class="final-row"><label><b>平衡末溫 (°C)</b></label><input type="number" id="tmix" class="input-box" placeholder="?"></div></div><button class="action-btn" id="btn-start" onclick="startSimulation()">開始混合</button><button class="action-btn reset-btn" id="btn-reset" onclick="resetSimulation()" style="display:none">重置實驗</button></footer></div><script>
const D={initialGroup:document.getElementById('initial-group'),mixBeaker:document.getElementById('mix-beaker'),waterMix:document.getElementById('water-mix'),dispMix:document.getElementById('disp-mix'),mathBoard:document.getElementById('math-board'),inputs:{m1:document.getElementById('m1'),t1:document.getElementById('t1'),s1:document.getElementById('s1'),m2:document.getElementById('m2'),t2:document.getElementById('t2'),s2:document.getElementById('s2'),tmix:document.getElementById('tmix')},btnModeLiquid:document.getElementById('mode-liquid'),btnModeSolid:document.getElementById('mode-solid'),lblObj1:document.getElementById('lbl-obj1'),lblObj2:document.getElementById('lbl-obj2'),btnStart:document.getElementById('btn-start'),btnReset:document.getElementById('btn-reset'),canvas:document.getElementById('simCanvas')};const ctx=D.canvas.getContext('2d');let state={mode:'liquid',phase:'idle',animationProgress:0,vals:{m1:100,t1:20,m2:100,t2:80,tmix:50}};
function init(){resizeCanvas();addEventListener('resize',resizeCanvas);D.btnModeLiquid.onclick=()=>setMode('liquid');D.btnModeSolid.onclick=()=>setMode('solid');Object.values(D.inputs).forEach(x=>x.addEventListener('input',updateStateFromInputs));requestAnimationFrame(renderLoop);setMode('liquid');updateStateFromInputs()}
function resizeCanvas(){let r=D.canvas.parentElement.getBoundingClientRect();D.canvas.width=r.width*2;D.canvas.height=r.height*2;ctx.setTransform(2,0,0,2,0,0)}
function setMode(m){state.mode=m;state.phase='idle';state.animationProgress=0;let vl=document.getElementById('view-liquid');if(m==='liquid'){vl.classList.add('active');D.canvas.classList.remove('active');D.btnModeLiquid.classList.add('active');D.btnModeSolid.classList.remove('active');D.lblObj1.textContent='液體 (A)';D.lblObj2.textContent='液體 (B)';D.inputs.s1.value=1;D.inputs.s2.value=1}else{vl.classList.remove('active');D.canvas.classList.add('active');D.btnModeLiquid.classList.remove('active');D.btnModeSolid.classList.add('active');D.lblObj1.textContent='液體';D.lblObj2.textContent='投入物';D.inputs.s1.value=1;D.inputs.s2.value=.09;setTimeout(resizeCanvas,0)}updateStateFromInputs()}
function updateStateFromInputs(){state.vals.m1=parseFloat(D.inputs.m1.value)||0;state.vals.t1=parseFloat(D.inputs.t1.value)||0;state.vals.m2=parseFloat(D.inputs.m2.value)||0;state.vals.t2=parseFloat(D.inputs.t2.value)||0;if(state.mode==='liquid'){document.getElementById('disp-t1').textContent=state.vals.t1+'°C';document.getElementById('disp-t2').textContent=state.vals.t2+'°C';let max=Math.max(state.vals.m1,state.vals.m2,1),w1=document.getElementById('water-1'),w2=document.getElementById('water-2');w1.style.height=state.vals.m1/max*80+'%';w2.style.height=state.vals.m2/max*80+'%';w1.style.background=tempToColor(state.vals.t1);w2.style.background=tempToColor(state.vals.t2)}}
async function startSimulation(){if(state.phase!=='idle'&&state.phase!=='result')return;let v={m1:parseFloat(D.inputs.m1.value),t1:parseFloat(D.inputs.t1.value),s1:parseFloat(D.inputs.s1.value),m2:parseFloat(D.inputs.m2.value),t2:parseFloat(D.inputs.t2.value),s2:parseFloat(D.inputs.s2.value),tmix:parseFloat(D.inputs.tmix.value)},keys=['m1','t1','s1','m2','t2','s2','tmix'],empty=keys.filter(k=>isNaN(v[k])),target='';if(empty.length>1){alert('資料不足，無法計算');return}target=empty.length===1?empty[0]:'tmix';try{if(target==='tmix')v.tmix=(v.m1*v.s1*v.t1+v.m2*v.s2*v.t2)/(v.m1*v.s1+v.m2*v.s2);else if(target==='m1')v.m1=-(v.m2*v.s2*(v.tmix-v.t2))/(v.s1*(v.tmix-v.t1));else if(target==='m2')v.m2=-(v.m1*v.s1*(v.tmix-v.t1))/(v.s2*(v.tmix-v.t2));else if(target==='t1')v.t1=v.tmix+(v.m2*v.s2*(v.tmix-v.t2))/(v.m1*v.s1);else if(target==='t2')v.t2=v.tmix+(v.m1*v.s1*(v.tmix-v.t1))/(v.m2*v.s2);else if(target==='s1')v.s1=-(v.m2*v.s2*(v.tmix-v.t2))/(v.m1*(v.tmix-v.t1));else if(target==='s2')v.s2=-(v.m1*v.s1*(v.tmix-v.t1))/(v.m2*(v.tmix-v.t2));if(!Object.values(v).every(Number.isFinite)||v.m1<0||v.m2<0||v.s1<=0||v.s2<=0)throw '設定數值無法形成合理的熱平衡'}catch(e){alert('計算錯誤：'+e);return}v.m1=+v.m1.toFixed(1);v.t1=+v.t1.toFixed(1);v.s1=+v.s1.toFixed(3);v.m2=+v.m2.toFixed(1);v.t2=+v.t2.toFixed(1);v.s2=+v.s2.toFixed(3);v.tmix=+v.tmix.toFixed(1);Object.keys(D.inputs).forEach(k=>D.inputs[k].value=v[k]);state.vals={...v};lockInputs(true);D.btnStart.style.display='none';D.btnReset.style.display='block';renderMathSteps(v,target);if(state.mode==='liquid'){D.initialGroup.style.display='none';D.mixBeaker.style.display='flex';D.dispMix.textContent=v.tmix.toFixed(1)+'°C';D.waterMix.style.background=tempToColor(v.tmix);D.waterMix.style.height='0%';setTimeout(()=>D.waterMix.style.height='80%',50);state.phase='result'}else{state.phase='animating';let st;function a(t){if(!st)st=t;state.animationProgress=Math.min(1,(t-st)/2000);if(state.animationProgress<1)requestAnimationFrame(a);else state.phase='result'}requestAnimationFrame(a)}}
function resetSimulation(){lockInputs(false);D.inputs.tmix.value='';D.btnStart.style.display='block';D.btnReset.style.display='none';state.phase='idle';state.animationProgress=0;D.initialGroup.style.display='flex';D.mixBeaker.style.display='none';D.waterMix.style.height='0%';updateStateFromInputs();D.mathBoard.innerHTML='<div class="intro">設定參數後按下「開始混合」，觀察熱量交換與平衡結果。</div>'}
function lockInputs(b){Object.values(D.inputs).forEach(x=>{if(x.id!=='tmix')x.disabled=b})}
function renderLoop(){let w=D.canvas.width/2,h=D.canvas.height/2;ctx.clearRect(0,0,w,h);if(state.mode==='solid')drawSolid(w,h);requestAnimationFrame(renderLoop)}
function drawSolid(w,h){let floor=h-20,cw=96,ch=145,x=w/2-cw/2,base=Math.min(state.vals.m1*.72,ch-34),rise=state.animationProgress>.7?(state.animationProgress-.5)*36:0;if(state.phase==='result')rise=18;drawBeaker(x,floor,cw,ch,base+rise,tempToColor(state.phase==='result'?state.vals.tmix:state.vals.t1),'液體');let startY=Math.max(48,h*.18),y=startY+(floor-12-startY)*state.animationProgress,s=38;ctx.fillStyle=tempToColor(state.vals.t2);ctx.strokeStyle='#555';ctx.lineWidth=2.5;ctx.fillRect(w/2-s/2,y-s,s,s);ctx.strokeRect(w/2-s/2,y-s,s,s);ctx.fillStyle='#333';ctx.font='bold 14px Arial';ctx.fillText('固體',w/2-14,y-s-7)}
function drawBeaker(x,y,w,h,wh,c,label){let r=12;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y-r);ctx.lineTo(x+w,y-h);if(wh>0){ctx.save();ctx.clip();ctx.fillStyle=c;ctx.fillRect(x,y-wh,w,h);ctx.restore()}ctx.strokeStyle='#333';ctx.lineWidth=3.5;ctx.stroke();if(label){ctx.fillStyle='#333';ctx.font='bold 14px Arial';ctx.fillText(label,x+w/2-14,y+20)}}
function tempToColor(t){let q=Math.max(0,Math.min(1,t/100)),r=Math.round(52+179*q),g=Math.round(152-76*q),b=Math.round(219-159*q);return `rgb(${r},${g},${b})`}
async function renderMathSteps(v,target){D.mathBoard.innerHTML='';let add=async html=>{let d=document.createElement('div');d.className='math-line';d.innerHTML=html;D.mathBoard.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));await new Promise(r=>setTimeout(r,500))},red=x=>`<b style="color:#d63031">${x}</b>`,blue=x=>`<b style="color:#0984e3">${x}</b>`,show=k=>k===target?red(k):v[k];await add(`<b>Step 1｜熱平衡原理</b><br>${blue('低溫吸熱')} ＝ ${red('高溫放熱')}`);let T=target==='tmix'?red('T'):v.tmix;await add(`<b>Step 2｜代入數值</b><br>${show('m1')}×${show('s1')}×(${T}−${show('t1')}) ＝ ${show('m2')}×${show('s2')}×(${show('t2')}−${T})`);let unit=target==='tmix'||target==='t1'||target==='t2'?'°C':target==='m1'||target==='m2'?'g':'cal/g·°C';await add(`<b>Step 3｜計算結果</b><br>${red(target)} ≈ ${red(v[target])} ${unit}`)}
addEventListener('load',init);
</script></body></html>
