<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>晟自然玩科學｜虹吸現象</title><style>
:root{--subject:#ef9db8;--subject-deep:#cf6f91;--subject-soft:#fff0f5;--subject-line:#f3c6d5;--ink:#3f3f46}*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:'Microsoft JhengHei','Segoe UI',sans-serif;color:#333;background:url('page.jpg') center/cover}body{display:flex;justify-content:center}.app-layout-wrapper{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.9)}.main-header{flex:0 0 60px;min-height:60px;width:100%;background:linear-gradient(90deg,#1a2a6c,#b21f1f,#fdbb2d);box-shadow:0 2px 8px #0003;z-index:100;display:flex;align-items:center;padding:0 15px;color:#fff}.logo-area{width:40px;height:40px;border-radius:50%;margin-right:14px;background:#fff url('logo.jpg') center/cover;border:2px solid #00d2ff;flex-shrink:0}.header-title{min-width:0;display:flex;align-items:center;flex-wrap:nowrap;gap:7px;flex:1;font-size:1rem;line-height:1;white-space:nowrap;overflow:hidden;text-shadow:1px 1px 2px #0005;padding-right:10px}.brand-name{font-weight:900;flex-shrink:0}.title-divider{opacity:.65}.module-name{font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{margin-left:auto;flex-shrink:0;background:#00B900;color:#fff;text-decoration:none;padding:6px 11px;border-radius:20px;font-size:.82rem;line-height:1;font-weight:bold;border:1px solid #ffffff80}.content-scroll-area{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;padding:0 10px 10px;display:flex;flex-direction:column;align-items:center}.simulation-container{order:1;width:100%;display:flex;justify-content:center;align-items:center;position:relative;min-height:250px;flex:1;background:transparent;overflow:hidden}.simulation-container canvas{max-width:100%;height:auto}.ui-card{order:2;width:100%;margin:0 0 10px;background:rgba(255,255,255,.97);border:1.5px solid var(--subject-line);border-left:5px solid var(--subject);border-radius:14px;box-shadow:0 3px 12px rgba(90,55,70,.10);padding:10px 12px 11px}.topic-description{text-align:center;color:#444;font-size:.9rem;line-height:1.45}.status-badge{display:inline-block;padding:5px 12px;border-radius:12px;background:var(--subject-soft);font-size:.9rem;font-weight:800;color:var(--subject-deep);border:1px solid var(--subject-line);transition:.3s}.status-badge.flowing{background:#e8f6ec;color:#25733a;border-color:#bfe4c8}.status-badge.broken{background:#fdebec;color:#a13a44;border-color:#f2c6ca}.status-badge.air-flow{background:#f4f1f2;color:#62575b;border-color:#ddd4d7}.hint{font-size:.82rem;color:#666;margin-top:7px}.controls-dock{flex:0 0 auto;width:calc(100% - 20px);margin:0 10px 8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border:1.5px solid var(--subject-line);border-radius:14px;box-shadow:0 -2px 12px rgba(90,55,70,.08),0 3px 12px rgba(90,55,70,.08);z-index:100;display:flex;flex-direction:column;gap:10px}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.control-group{display:flex;flex-direction:column;gap:7px;padding:8px 9px;border-radius:10px;background:var(--subject-soft);border:1px solid var(--subject-line)}.group-left,.group-right{border-left:4px solid var(--subject)}.group-title{font-size:.85rem;font-weight:800;color:var(--subject-deep)}.slider-row{display:flex;align-items:center;font-size:.84rem;color:#555}.slider-row label{width:42px;flex-shrink:0;font-weight:bold}.slider-row input{flex:1;margin-left:5px}input[type=range]{width:100%;accent-color:var(--subject)}.button-row{display:flex;gap:8px;width:100%}.action-btn,.reset-btn{border-radius:9px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:none}.action-btn{flex:1;padding:11px;border:1.5px solid var(--subject-deep);background:var(--subject);color:#fff;font-size:1rem}.action-btn:hover{background:var(--subject-deep)}.action-btn:active{transform:scale(.98)}.reset-btn{flex:0 0 46px;height:46px;border:1.5px solid var(--subject-line);background:#fff;color:var(--subject-deep);font-size:1.35rem}.reset-btn:hover{background:var(--subject-soft)}.reset-btn:active{transform:scale(.96)}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.88rem;gap:4px;padding-right:6px}.line-btn{font-size:.74rem;padding:6px 8px}.content-scroll-area{padding:0 6px 6px}.ui-card{margin-bottom:7px;padding:9px 10px}.controls-dock{width:calc(100% - 12px);margin:0 6px 6px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));gap:8px}.control-grid{gap:7px}.control-group{padding:7px 7px;gap:5px}.slider-row{font-size:.78rem}.slider-row label{width:38px}.action-btn{padding:9px;font-size:.95rem}.reset-btn{height:42px;flex-basis:42px}}
</style></head><body><div class="app-layout-wrapper"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">虹吸現象</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><main class="content-scroll-area"><div class="ui-card topic-description"><div id="status-display" class="status-badge">請按下方按鈕「水管充滿水」</div><div class="hint">試著調整「杯子」與「管口」高低，觀察水流是否流動或停止？</div></div><div class="simulation-container" id="sim-container"><canvas id="siphonCanvas" width="360" height="340"></canvas></div></main><footer class="controls-dock" id="controls-area"><div class="control-grid"><div class="control-group group-left"><div class="group-title">左杯（藍）</div><div class="slider-row"><label>杯子</label><input type="range" id="sl-left-cup" min="0" max="150" value="50"></div><div class="slider-row"><label>管口</label><input type="range" id="sl-left-tube" min="0" max="150" value="80"></div></div><div class="control-group group-right"><div class="group-title">右杯（紅）</div><div class="slider-row"><label>杯子</label><input type="range" id="sl-right-cup" min="0" max="100" value="20"></div><div class="slider-row"><label>管口</label><input type="range" id="sl-right-tube" min="0" max="100" value="80"></div></div></div><div class="button-row"><button class="action-btn" id="prime-btn">水管充滿水</button><button class="reset-btn" id="reset-btn" title="重置">↺</button></div></footer></div><script>
const canvas=document.getElementById('siphonCanvas'),ctx=canvas.getContext('2d'),statusDisplay=document.getElementById('status-display'),primeBtn=document.getElementById('prime-btn'),resetBtn=document.getElementById('reset-btn'),slLeftCup=document.getElementById('sl-left-cup'),slLeftTube=document.getElementById('sl-left-tube'),slRightCup=document.getElementById('sl-right-cup'),slRightTube=document.getElementById('sl-right-tube');
const CFG={baseY:300,cupW:70,cupH:100,leftX:50,rightX:240,waterColor:'rgba(50,100,220,.85)',flowK:.2};let state={active:false,siphonBroken:true,valHL:50,valTL:80,valHR:20,valTR:80,wL:70,wR:30,particles:[]};
function init(){slLeftCup.addEventListener('input',updateInput);slLeftTube.addEventListener('input',updateInput);slRightCup.addEventListener('input',updateInput);slRightTube.addEventListener('input',updateInput);primeBtn.addEventListener('click',toggleSim);resetBtn.addEventListener('click',resetSim);for(let i=0;i<25;i++)state.particles.push({offset:Math.random(),speed:0});updateInput();requestAnimationFrame(loop)}
function updateInput(){state.valHL=parseInt(slLeftCup.value);state.valTL=parseInt(slLeftTube.value);state.valHR=parseInt(slRightCup.value);state.valTR=parseInt(slRightTube.value)}
function toggleSim(){if(!state.active){state.active=true;state.siphonBroken=false;primeBtn.innerText='停止實驗';primeBtn.style.background='#d9534f'}else{state.active=false;state.siphonBroken=true;primeBtn.innerText='水管充滿水';primeBtn.style.background='';statusDisplay.innerText='實驗暫停';statusDisplay.className='status-badge'}}
function resetSim(){slLeftCup.value=50;slLeftTube.value=80;slRightCup.value=20;slRightTube.value=80;state.wL=70;state.wR=30;state.active=false;state.siphonBroken=true;primeBtn.innerText='水管充滿水';primeBtn.style.background='';statusDisplay.innerText='實驗已重置';statusDisplay.className='status-badge';updateInput()}
function autoStop(){state.active=false;primeBtn.innerText='水管充滿水';primeBtn.style.background=''}
function updatePhysics(){let yBaseL=CFG.baseY-state.valHL,yBaseR=CFG.baseY-state.valHR,ySurfL=yBaseL-state.wL,ySurfR=yBaseR-state.wR,cupTopL=yBaseL-CFG.cupH,cupTopR=yBaseR-CFG.cupH;let tipYL=cupTopL-30+(state.valTL/100)*(CFG.cupH+35),tipYR=cupTopR-30+(state.valTR/100)*(CFG.cupH+35);tipYL=Math.min(tipYL,yBaseL-4);tipYR=Math.min(tipYR,yBaseR-4);state.renderTipYL=tipYL;state.renderTipYR=tipYR;state.renderBaseYL=yBaseL;state.renderBaseYR=yBaseR;if(!state.active)return;let isSubmergedL=tipYL>=ySurfL&&state.wL>0,headL=isSubmergedL?ySurfL:tipYL,isSubmergedR=tipYR>=ySurfR&&state.wR>0,headR=isSubmergedR?ySurfR:tipYR,diff=headR-headL,flow=0,statusText='',statusClass='';if(Math.abs(diff)<.5){statusText='平衡：兩邊水位一樣高';statusClass='flowing';autoStop()}else if(diff>0){if(isSubmergedL){flow=diff*CFG.flowK*.1;statusText='流向：左 ➔ 右';statusClass='flowing';if(!isSubmergedR){statusText+=' (懸空流出)';statusClass='air-flow'}}else state.siphonBroken=true}else{if(isSubmergedR){flow=diff*CFG.flowK*.1;statusText='流向：左 ⬅ 右';statusClass='flowing';if(!isSubmergedL){statusText+=' (懸空流出)';statusClass='air-flow'}}else state.siphonBroken=true}if(state.siphonBroken){statusDisplay.innerText='停止：進氣口吸入空氣';statusDisplay.className='status-badge broken';state.particles.forEach(p=>p.speed=0);autoStop();return}state.wL-=flow;state.wR+=flow;state.wL=Math.max(0,Math.min(100,state.wL));state.wR=Math.max(0,Math.min(100,state.wR));statusDisplay.innerText=statusText;statusDisplay.className='status-badge '+statusClass;let speed=flow*.3;state.particles.forEach(p=>p.speed=speed)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawCup(CFG.leftX,state.renderBaseYL,state.wL,'#1a73e8');drawCup(CFG.rightX,state.renderBaseYR,state.wR,'#d93025');drawTube(state.renderTipYL,state.renderTipYR)}
function drawCup(x,bottomY,waterH,color){let w=CFG.cupW,h=CFG.cupH,topY=bottomY-h;if(waterH>0){ctx.fillStyle=CFG.waterColor;ctx.fillRect(x,bottomY-waterH,w,waterH)}ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,bottomY);ctx.lineTo(x+w,bottomY);ctx.lineTo(x+w,topY);ctx.stroke();ctx.fillStyle='#888';ctx.fillRect(x-5,CFG.baseY,w+10,4);ctx.fillStyle='#bbb';ctx.fillRect(x+w/2-4,bottomY,8,CFG.baseY-bottomY)}
function drawTube(tipYL,tipYR){let p1={x:CFG.leftX+CFG.cupW-15,y:tipYL},highestObjY=Math.min(tipYL,tipYR,CFG.baseY-state.valHL-CFG.cupH,CFG.baseY-state.valHR-CFG.cupH),topY=Math.max(10,highestObjY-30);if(topY>CFG.baseY-150)topY=CFG.baseY-150;let p2={x:p1.x,y:topY},p3={x:CFG.rightX+15,y:topY},p4={x:p3.x,y:tipYR};ctx.beginPath();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=12;ctx.strokeStyle=state.active&&!state.siphonBroken?CFG.waterColor:'rgba(200,220,230,.3)';ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();if(state.active&&!state.siphonBroken)drawFlowParticles(p1,p2,p3,p4);ctx.lineWidth=14;ctx.strokeStyle='rgba(0,0,0,.3)';ctx.globalCompositeOperation='destination-over';ctx.stroke();ctx.globalCompositeOperation='source-over';ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.4)';ctx.stroke()}
function drawFlowParticles(p1,p2,p3,p4){let d1=Math.abs(p2.y-p1.y),d2=Math.abs(p3.x-p2.x),d3=Math.abs(p4.y-p3.y),totalLen=d1+d2+d3;ctx.fillStyle='rgba(255,255,255,.9)';state.particles.forEach(pt=>{pt.offset+=pt.speed;if(pt.offset>1)pt.offset-=1;if(pt.offset<0)pt.offset+=1;let currDist=pt.offset*totalLen,x,y;if(currDist<d1){let r=currDist/d1;x=p1.x;y=p1.y+(p2.y-p1.y)*r}else if(currDist<d1+d2){let r=(currDist-d1)/d2;x=p2.x+(p3.x-p2.x)*r;y=p2.y}else{let r=(currDist-d1-d2)/d3;x=p3.x;y=p3.y+(p4.y-p3.y)*r}ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()})}
function loop(){updatePhysics();draw();requestAnimationFrame(loop)}window.addEventListener('load',init);
</script></body></html>
