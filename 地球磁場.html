<style>
:root{--subject:#91cfa6;--subject-deep:#4f9568;--subject-soft:#edf8f0;--subject-line:#bfe2c9;--ink:#3f3f46}*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100dvh;overflow:hidden;font-family:'Microsoft JhengHei','Segoe UI',sans-serif;color:#333;background:#000 url('page.jpg') center/cover;user-select:none;-webkit-user-select:none}body{display:flex;justify-content:center}.app-layout-wrapper{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;position:relative;background:rgba(255,255,255,.9);margin:0 auto}.main-header{flex:0 0 60px;width:100%;background:linear-gradient(90deg,#1a2a6c,#b21f1f,#fdbb2d);box-shadow:0 2px 8px #0003;z-index:100;display:flex;align-items:center;padding:0 15px;color:#fff}.logo-area{width:40px;height:40px;background:#fff url('logo.jpg') center/cover;border-radius:50%;margin-right:14px;border:2px solid #00d2ff;flex-shrink:0}.header-title{min-width:0;display:flex;align-items:center;gap:7px;flex:1;font-size:1rem;line-height:1;white-space:nowrap;overflow:hidden;text-shadow:1px 1px 2px #0005;padding-right:10px}.brand-name{font-weight:900;flex-shrink:0}.title-divider{opacity:.65}.module-name{font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{margin-left:auto;background:#00B900;color:#fff;text-decoration:none;padding:6px 11px;border-radius:20px;font-size:.82rem;font-weight:bold;border:1px solid #ffffff80;flex-shrink:0;white-space:nowrap}#simulation-area{flex:1 1 auto;min-height:0;width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:6px 10px 0}.simulation-container{flex:1 1 auto;min-height:0;width:100%;position:relative;background:rgba(10,20,35,.94);overflow:hidden;display:flex;justify-content:center;align-items:center;border-radius:14px 14px 0 0}canvas{width:100%;height:100%;touch-action:none;position:absolute;inset:0}.message-card{flex:0 0 auto;width:100%;background:#fffffff7;border:1.5px solid var(--subject-line);border-left:5px solid var(--subject);border-radius:0 0 14px 14px;box-shadow:0 3px 12px rgba(50,90,60,.10);padding:9px 12px;text-align:center;color:#4d5b51;font-size:.9rem;font-weight:700;line-height:1.4}.internal-instruction{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.92);font-size:1rem;font-weight:bold;pointer-events:none;text-shadow:0 2px 4px #000c;background:rgba(0,0,0,.42);padding:5px 14px;border-radius:20px;border:1px solid #ffffff33;z-index:10;white-space:nowrap}.radar-widget{position:absolute;right:18px;top:56px;width:50px;height:50px;border:2px solid #ffffff4d;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 40%,#ffffff1a 100%);z-index:10}.radar-widget::before{content:'';position:absolute;top:5px;bottom:5px;left:50%;width:1px;background:#ffffff33}.radar-widget::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:1px;background:#ffffff33}.radar-label{position:absolute;font-size:10px;font-weight:bold;color:#ffffff99;line-height:1}.label-n{top:2px;left:50%;transform:translateX(-50%);color:#ff5555}.label-s{bottom:2px;left:50%;transform:translateX(-50%)}.label-e{right:4px;top:50%;transform:translateY(-50%)}.label-w{left:4px;top:50%;transform:translateY(-50%)}.main-footer{flex:0 0 auto;width:calc(100% - 20px);margin:6px 10px 8px;background:#fffffff9;border:1.5px solid var(--subject-line);border-radius:14px;box-shadow:0 -2px 12px rgba(50,90,60,.08),0 3px 12px rgba(50,90,60,.08);z-index:100;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.toggle-btn{width:100%;padding:10px 5px;border:1px solid var(--subject-line);border-radius:9px;text-align:center;background:#fff;color:var(--subject-deep);font-size:.92rem;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(50,90,60,.12)}.toggle-btn.active{background:var(--subject-deep);color:#fff;border-color:var(--subject-deep)}.toggle-btn:active{transform:scale(.98)}@media(max-width:430px){.main-header{padding:0 10px}.logo-area{width:36px;height:36px;margin-right:9px}.header-title{font-size:.86rem;gap:4px;padding-right:5px}.line-btn{font-size:.73rem;padding:6px 8px}#simulation-area{padding:4px 6px 0}.message-card{font-size:.82rem;padding:8px 9px}.internal-instruction{font-size:.88rem;top:12px}.radar-widget{right:12px;top:48px}.main-footer{width:calc(100% - 12px);margin:6px 6px 6px;padding:8px 9px calc(8px + env(safe-area-inset-bottom))}.toggle-btn{font-size:.84rem;padding:9px 4px}}
</style></head><body><div class="app-layout-wrapper"><header class="main-header"><a href="index.html" class="logo-area" title="返回大廳"></a><div class="header-title"><span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">地球磁場</span></div><a href="https://line.me/ti/g2/TTCqPpZP6lQqX1z_AUDPNm4977Dvylew3O7oBg" target="_blank" class="line-btn">加 LINE 討論</a></header><div id="simulation-area"><div class="simulation-container" id="sim-container"><canvas id="simCanvas"></canvas><div class="internal-instruction">💡 請任意移動磁針</div><div class="radar-widget"><div class="radar-label label-n">N</div><div class="radar-label label-e">E</div><div class="radar-label label-s">S</div><div class="radar-label label-w">W</div></div></div><div class="message-card">移動磁針，觀察地球不同位置的磁針方向與地球磁場的關係。</div></div><footer class="main-footer"><div class="toggle-btn active" id="btn-magnet" onclick="toggleLayer('magnet')">顯示地磁與磁力線</div></footer></div>
<script>
const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const LOGICAL_SIZE=1000;const R_EARTH=320;const ORBIT_R=R_EARTH+75;const FONTS={pole:"bold 50px Arial",label:"bold 36px Microsoft JhengHei",geo:"bold 36px Microsoft JhengHei"};const state={magnet:true};const MAG_TILT=-11.9*(Math.PI/180);let compassPos={x:ORBIT_R,y:0};let compassAngle=-Math.PI/2;let isDragging=false;let flowParticles=[];let renderScale=1;let renderOffsetX=0;let renderOffsetY=0;
function resize(){const container=document.getElementById('sim-container');const w=container.clientWidth;const h=container.clientHeight;const dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);canvas.style.width=w+'px';canvas.style.height=h+'px';const minDim=Math.min(w,h);renderScale=(minDim*.95)/LOGICAL_SIZE;renderOffsetX=w/2;renderOffsetY=h/2}window.addEventListener('resize',resize);function init(){resize();for(let i=0;i<60;i++)flowParticles.push({t:Math.random(),lineIndex:Math.floor(Math.random()*6),speed:.002+Math.random()*.003});updateCompassPhysics(ORBIT_R,0);requestAnimationFrame(loop)}function loop(){update();draw();requestAnimationFrame(loop)}function update(){for(const p of flowParticles){p.t+=p.speed;if(p.t>1)p.t=0}}function draw(){const w=canvas.width/(window.devicePixelRatio||1),h=canvas.height/(window.devicePixelRatio||1);ctx.clearRect(0,0,w,h);drawStars(w,h);ctx.save();ctx.translate(renderOffsetX,renderOffsetY);ctx.scale(renderScale,renderScale);drawEarth();drawGeoMarkers();ctx.save();ctx.rotate(MAG_TILT);if(state.magnet){drawInternalMagnet();drawMagneticFields();drawMagAxis()}ctx.restore();drawCompassClean();ctx.restore()}function drawStars(w,h){ctx.fillStyle='rgba(255,255,255,0.6)';const rand=n=>Math.abs(Math.sin(n*12.9898)*43758.5453)%1;for(let i=0;i<40;i++){const x=rand(i)*w,y=rand(i*2)*h,r=rand(i*3)*1.5+.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}}
function drawEarth(){const grad=ctx.createRadialGradient(0,0,R_EARTH,0,0,R_EARTH+50);grad.addColorStop(0,'rgba(0,150,255,0.3)');grad.addColorStop(1,'rgba(0,150,255,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,R_EARTH+50,0,Math.PI*2);ctx.fill();ctx.fillStyle=state.magnet?'rgba(10,20,35,0.9)':'#0b1d2e';ctx.strokeStyle='#2980b9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R_EARTH,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-R_EARTH);ctx.lineTo(0,R_EARTH);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,R_EARTH,R_EARTH*.35,0,0,Math.PI*2);ctx.stroke()}
function drawGeoMarkers(){const R_GEO_LABEL_Y=R_EARTH+35,R_GEO_LABEL_X=150,AXIS_LEN=R_EARTH+140;ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.setLineDash([15,15]);ctx.beginPath();ctx.moveTo(0,-AXIS_LEN);ctx.lineTo(0,AXIS_LEN);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font=FONTS.label;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('自轉軸',0,-AXIS_LEN-30);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillRect(-3,-R_EARTH-3,6,6);ctx.fillRect(-3,R_EARTH-3,6,6);ctx.font=FONTS.geo;ctx.textAlign='left';ctx.fillText('地理北極(正北)',R_GEO_LABEL_X,-R_GEO_LABEL_Y);drawCuteArrow(0,-R_EARTH-5,R_GEO_LABEL_X-10,-R_GEO_LABEL_Y,'#fff');ctx.textAlign='right';ctx.fillText('地理南極',-R_GEO_LABEL_X,R_GEO_LABEL_Y);drawCuteArrow(0,R_EARTH+5,-R_GEO_LABEL_X+10,R_GEO_LABEL_Y,'#fff')}
function drawInternalMagnet(){const w=70,h=380;ctx.fillStyle='#27ae60';ctx.fillRect(-w/2,-h/2,w,h/2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-w/2,-h/2,w,h/2);ctx.fillStyle='#c0392b';ctx.fillRect(-w/2,0,w,h/2);ctx.strokeRect(-w/2,0,w,h/2);drawLabelAt(0,-h/4,'S',FONTS.pole,'#fff');drawLabelAt(0,h/4,'N',FONTS.pole,'#fff');const northMarkerY=-R_EARTH,southMarkerY=R_EARTH;ctx.beginPath();ctx.fillStyle='#2ecc71';ctx.arc(0,northMarkerY,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.fillStyle='#e74c3c';ctx.arc(0,southMarkerY,8,0,Math.PI*2);ctx.fill();ctx.stroke();const labelNx=-150,labelNy=-R_EARTH-35,labelSx=150,labelSy=R_EARTH+35;drawLabelAt(labelNx,labelNy,'地磁北極',FONTS.label,'#f1c40f');drawLabelAt(labelSx,labelSy,'地磁南極',FONTS.label,'#f1c40f');drawCuteArrow(0,northMarkerY-10,labelNx+70,labelNy+10,'#f1c40f');drawCuteArrow(0,southMarkerY+10,labelSx-70,labelSy-10,'#f1c40f')}
function drawCuteArrow(x1,y1,x2,y2,color){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=3;const cpX=(x1+x2)/2,curvature=(x2-x1)*.2,cpY=y1+Math.abs(curvature)*(y1<0?.2:-.2);ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cpX,cpY,x2,y2);ctx.stroke();ctx.save();ctx.translate(x2,y2);ctx.rotate(Math.atan2(y2-cpY,x2-cpX));ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-20,-12);ctx.lineTo(-20,12);ctx.fill();ctx.restore()}function drawMagAxis(){ctx.beginPath();ctx.strokeStyle='rgba(241,196,15,0.6)';ctx.setLineDash([15,15]);ctx.lineWidth=2;const axisLen=R_EARTH+140;ctx.moveTo(0,-axisLen);ctx.lineTo(0,axisLen);ctx.stroke();ctx.setLineDash([]);drawLabelAt(0,-axisLen-30,'磁軸',FONTS.label,'#f1c40f','center')}function drawLabelAt(lx,ly,text,font,color,align='center'){ctx.save();ctx.translate(lx,ly);ctx.rotate(-MAG_TILT);ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=4;ctx.fillText(text,0,0);ctx.restore()}
function drawMagneticFields(){ctx.strokeStyle='rgba(0,210,255,0.2)';ctx.lineWidth=2;const scales=[1.6,2.5,4];scales.forEach((s,idx)=>{drawSingleLine(-s,idx);drawSingleLine(s,idx+3)})}function drawSingleLine(scaleX,idx){const startY=R_EARTH,endY=-R_EARTH,cpX=R_EARTH*scaleX,bulge=Math.abs(cpX)*.6,cpY_Start=startY+bulge,cpY_End=endY-bulge;ctx.beginPath();ctx.moveTo(0,startY);ctx.bezierCurveTo(cpX,cpY_Start,cpX,cpY_End,0,endY);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.9)';for(const p of flowParticles)if(p.lineIndex===idx){const t=p.t,x=bezier(0,cpX,cpX,0,t),y=bezier(startY,cpY_Start,cpY_End,endY,t);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}function bezier(p0,p1,p2,p3,t){const m=1-t;return m*m*m*p0+3*m*m*t*p1+3*m*t*t*p2+t*t*t*p3}
function updateCompassPhysics(worldX,worldY){const cosT=Math.cos(-MAG_TILT),sinT=Math.sin(-MAG_TILT),rx=worldX*cosT-worldY*sinT,ry=worldX*sinT+worldY*cosT,r=Math.sqrt(rx*rx+ry*ry),bx=3*rx*ry,by=2*ry*ry-rx*rx,bLen=Math.sqrt(bx*bx+by*by),bx_norm=bx/bLen,by_norm=by/bLen,t1x=-ry,t1y=rx,t2x=ry,t2y=-rx,dot1=t1x*bx_norm+t1y*by_norm;let tx_final,ty_final;if(dot1>0){tx_final=t1x;ty_final=t1y}else{tx_final=t2x;ty_final=t2y}const tLenFinal=Math.sqrt(tx_final*tx_final+ty_final*ty_final),tx_norm=tx_final/tLenFinal,ty_norm=ty_final/tLenFinal,absSinLat=Math.abs(ry)/r;let factor=0;if(absSinLat<.5)factor=0;else if(absSinLat>.985)factor=1;else factor=(absSinLat-.5)/.485;const final_x=tx_norm*(1-factor)+bx_norm*factor,final_y=ty_norm*(1-factor)+by_norm*factor;compassAngle=Math.atan2(final_y,final_x)+MAG_TILT}
function drawCompassClean(){const cx=compassPos.x,cy=compassPos.y;if(isDragging){ctx.save();ctx.strokeStyle='rgba(255,50,50,0.3)';ctx.setLineDash([5,5]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(0,0);ctx.stroke();ctx.restore()}ctx.save();ctx.translate(cx,cy);ctx.rotate(compassAngle);const size=10,len=50;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-size,-14);ctx.lineTo(len,0);ctx.lineTo(-size,14);ctx.fillStyle='#ff3333';ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-size,-14);ctx.lineTo(-len,0);ctx.lineTo(-size,14);ctx.fillStyle='#e0e0e0';ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.save();ctx.rotate(-Math.PI/2);ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 28px sans-serif';ctx.fillText('N',24,36);ctx.restore();ctx.restore()}
window.toggleLayer=function(key){if(key==='magnet'){state.magnet=!state.magnet;const btn=document.getElementById('btn-magnet');if(btn){btn.classList.toggle('active');btn.textContent=state.magnet?'顯示地磁與磁力線':'隱藏地磁與磁力線'}}};function getLogicalPos(e){const rect=canvas.getBoundingClientRect(),clientX=e.touches&&e.touches.length?e.touches[0].clientX:e.clientX,clientY=e.touches&&e.touches.length?e.touches[0].clientY:e.clientY;if(clientX===undefined)return{x:0,y:0};return{x:(clientX-rect.left-renderOffsetX)/renderScale,y:(clientY-rect.top-renderOffsetY)/renderScale}}function onDown(e){isDragging=true;const pos=getLogicalPos(e);updateCompassPosition(pos.x,pos.y);if(e.cancelable)e.preventDefault()}function onMove(e){if(!isDragging)return;if(e.cancelable)e.preventDefault();const pos=getLogicalPos(e);updateCompassPosition(pos.x,pos.y)}function updateCompassPosition(tx,ty){const ang=Math.atan2(ty,tx);compassPos.x=Math.cos(ang)*ORBIT_R;compassPos.y=Math.sin(ang)*ORBIT_R;updateCompassPhysics(compassPos.x,compassPos.y)}function onUp(){isDragging=false}canvas.addEventListener('mousedown',onDown);window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);canvas.addEventListener('touchstart',onDown,{passive:false});window.addEventListener('touchmove',onMove,{passive:false});window.addEventListener('touchend',onUp);init();
</script></body></html>
