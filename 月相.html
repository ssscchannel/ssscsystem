om:25px;left:50%;transform:translateX(-50%)">06:00</div><div class="moon-visual" id="moonVisual"><div class="moon-shadow-part"></div></div><div class="moon-label" id="moonLabel"></div></div><div class="view-from-earth"><div class="view-title">月相盈虧 (面向南方)</div><div class="moon-phase-render"><svg class="phase-svg" viewBox="0 0 100 100"><path id="phasePath" class="phase-path"/></svg></div><div class="direction-labels"><span class="dir-tag">東</span><span class="dir-tag">西</span></div></div><div class="view-horizon"><div class="view-title">當日軌跡 (面向南方)</div><div class="horizon-stage"><div class="horizon-moon" id="horizonMoon"><svg class="phase-svg" viewBox="0 0 100 100"><path id="horizonPhasePath" class="phase-path"/></svg></div></div><div class="direction-labels"><span class="dir-tag">東升</span><span class="dir-tag">西落</span></div></div></div></div><div class="ui-card-style"><div class="info-header"><span class="date-display" id="dateDisplay">農曆 初一</span><div class="phase-name-group"><span class="phase-name" id="phaseName">新月 (朔)</span></div></div><div class="info-grid"><div class="info-item"><span class="label">🌅 月出時刻：</span><span class="highlight" id="moonRiseTime">06:00</span></div><div class="info-item"><span class="label">🌄 月落時刻：</span><span class="highlight" id="moonSetTime">18:00</span></div><div class="info-item"><span class="label">🌓 明暗狀況：</span><span class="blue-high" id="brightnessInfo">全暗</span></div><div class="info-item"><span class="label">🌟 特殊現象：</span><span id="phenomenonDisplay">無</span></div></div><div class="desc-wrapper"><span class="label">💡 說　　明：</span><span id="descText"></span></div></div></main><footer class="controls-dock"><div class="btn-group"><button class="btn" onclick="stopAllAnim();setLunarDay(1)">初一</button><button class="btn" onclick="stopAllAnim();setLunarDay(8.4)">初七或初八</button><button class="btn" onclick="stopAllAnim();setLunarDay(15.8)">十五或十六</button><button class="btn" onclick="stopAllAnim();setLunarDay(23.1)">廿二或廿三</button><select <script>
function resizeSimulation(){const w=document.getElementById('simWrapper'),s=document.getElementById('simContainer'),a=document.querySelector('.app-layout-wrapper'),aw=Math.min(a.clientWidth,innerWidth)-20;if(aw<600){const k=aw/600;s.style.transform=`scale(${k})`;w.style.width=600*k+'px';w.style.height=500*k+'px'}else{s.style.transform='none';w.style.width='600px';w.style.height='500px'}}addEventListener('resize',resizeSimulation);
function setLunarDay(d){daySlider.value=d;updateSim('manual')}function setTime(h){timeSlider.value=h;updateSim('manual')}function applyFestival(v){if(v){stopAllAnim();setLunarDay(+v)}}let dayAnim=null,timeAnim=null;document.addEventListener('pointerdown',e=>{if(!e.target.closest('.btn-auto'))stopAllAnim()});function stopAllAnim(){let x=false;if(dayAnim){clearInterval(dayAnim);dayAnim=null;btnAutoDay.innerText='▶';btnAutoDay.classList.remove('active');x=true}if(timeAnim){clearInterval(timeAnim);timeAnim=null;btnAutoTime.innerText='▶';btnAutoTime.classList.remove('active');x=true}if(x)updateSim('manual')}
function toggleDayAnim(){const active=btnAutoDay.classList.contains('active');stopAllAnim();if(!active){btnAutoDay.innerText='■';btnAutoDay.classList.add('active');let v=+daySlider.value;dayAnim=setInterval(()=>{v+=.1;if(v>30.5)v=1;updateSim('autoDay',v)},40)}}function toggleTimeAnim(){const active=btnAutoTime.classList.contains('active');stopAllAnim();if(!active){btnAutoTime.innerText='■';btnAutoTime.classList.add('active');let v=+timeSlider.value;timeAnim=setInterval(()=>{v+=.06;if(v>=24)v=0;updateSim('autoTime',v)},30)}}
function updateSim(mode='manual',ov=null){let d=+daySlider.value,t=+timeSlider.value;if(mode==='autoDay'&&ov!==null){d=ov;daySlider.value=d>30?30:d}if(mode==='autoTime'&&ov!==null){t=ov;timeSlider.value=t}dayVal.innerText=Math.floor(d);timeVal.innerText=formatTime(t);const angle=(d-1)/29.5*360,r=angle*Math.PI/180,x=Math.cos(r)*150,y=-Math.sin(r)*150;moonVisual.style.transform=`translate(${x}px,${y}px)`;moonLabel.style.transform=`translate(${x}px,${y-25}px) translateX(-50%)`;observerContainer.style.transform=`translate(-50%,-50%) rotate(${90-(t-12)*15}deg)`;if(mode!=='autoDay')updateHorizonView(angle,(t-12)*15,d);updateInfoPanel(d);if(mode!=='autoTime')drawMoonPhase(d);document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));if(mode==='manual'){const n=Math.floor(d),bs=document.querySelectorAll('.btn');if(Math.abs(d-1)<2)bs[0].classList.add('active');else if(n===7||n===8)bs[1].classList.add('active');else if(n===15||n===16)bs[2].classList.add('active');else if(n===22||n===23)bs[3].classList.add('active')}}
function updateHorizonView(mo,ob,d){let delta=mo-ob;while(delta<=-180)delta+=360;while(delta>180)delta-=360;if(delta>-100&&delta<100){horizonMoon.style.display='block';const r=delta*Math.PI/180;horizonMoon.style.left=50-Math.sin(r)*42+'%';horizonMoon.style.top=100-Math.cos(r)*75+'%';horizonMoon.style.transform=`translate(-50%,-50%) rotate(${-delta}deg)`}else horizonMoon.style.display='none';drawMoonPhasePath(d,'horizonPhasePath')}
function updateInfoPanel(d){const n=Math.floor(d);let phase='',tide='',eclipse='',show=false,rise=6,set=18,bright='',desc='';if(n>=29||n<=1)bright='全暗';else if(n>=15&&n<=16)bright='全亮';else if(n>=2&&n<=14)bright='西亮東暗';else bright='西暗東亮';if(d>=29.5){phase='晦月';tide='大潮';show=true;desc='月球週期的最後一天，看不見月亮。'}else if(n<=1){phase='新月 (朔)';tide='大潮';eclipse=Math.abs(d-1)<1.5?'可能日食':'';show=true;desc='月球位於地球與太陽中間，背光面向地球。 班別：早班月亮'}else if(n===7||n===8){phase='上弦月';tide='小潮';show=true;rise=12;set=24;desc='中午升起，午夜落下。 班別：午班月亮'}else if(n===15||n===16){phase='滿月 (望)';tide='大潮';eclipse=Math.abs(d-15)<1.5?'可能月食':'';show=true;rise=18;set=6;desc='太陽西落，月球東昇，整夜可見。 班別：晚班月亮'}else if(n===22||n===23){phase='下弦月';tide='小潮';show=true;rise=0;set=12;desc='午夜升起，中午落下。 班別：大夜班月亮'}else if(d<7){phase='眉月';tide='中潮';rise=9;set=21;desc='傍晚見於西方低空。'}else if(d<15){phase='盈凸月';tide='中潮';rise=15;set=3;desc='午後升起，凌晨落下。'}else if(d<22){phase='虧凸月';tide='中潮';rise=21;set=9;desc='入夜升起，清晨西方可見。'}else{phase='殘月';tide='中潮';rise=3;set=15;desc='清晨東方低空可見。'}const dm=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];dateDisplay.innerText='農曆 '+(dm[n]||'');phaseName.innerText=show?phase:'';phaseName.style.display=show?'inline':'none';if(show){const c=tide==='大潮'?'#c0392b':tide==='小潮'?'#27ae60':'#7f8c8d';phenomenonDisplay.innerHTML=`<span class="tide-badge" style="background:${c}">${tide}</span>${eclipse?` <span class="phenomenon-badge">${eclipse}</span>`:''}`}else phenomenonDisplay.innerText='無';const st=[1,7,8,15,16,22,23].includes(n);moonRiseTime.innerText=st?formatTime(rise):'';moonSetTime.innerText=st?formatTime(set):'';brightnessInfo.innerText=bright;descText.innerText=desc}
function formatTime(h){h%=24;const hh=Math.floor(h),mm=Math.floor((h-hh)*60);return `${hh<10?'0'+hh:hh}:${mm<10?'0'+mm:mm}`}
function drawMoonPhase(d){drawMoonPhasePath(d,'phasePath')}function drawMoonPhasePath(d,id){let c=(d-1)/29.5;if(c<0)c=0;if(c>1)c%=1;let p='';if(c<=.5){if(c<.25)p=`M 50 0 A 50 50 0 0 1 50 100 A ${50*Math.cos(c*2*Math.PI)} 50 0 0 0 50 0`;else p=`M 50 0 A 50 50 0 0 1 50 100 A ${-50*Math.cos(c*2*Math.PI)} 50 0 0 1 50 0`}else{if(c<=.75)p=`M 50 0 A 50 50 0 0 0 50 100 A ${-50*Math.cos(c*2*Math.PI)} 50 0 0 0 50 0`;else p=`M 50 0 A 50 50 0 0 0 50 100 A ${50*Math.cos(c*2*Math.PI)} 50 0 0 1 50 0`}if(Math.abs(d-15)<.5)p='M 50 0 A 50 50 0 1 1 50 100 A 50 50 0 1 1 50 0';if(d<1||d>29.5)p='';document.getElementById(id).setAttribute('d',p)}
window.onload=()=>{resizeSimulation();updateSim('manual')};
