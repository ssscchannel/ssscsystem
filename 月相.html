<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>晟自然玩科學｜月相盈虧</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#preview{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="preview" src="月相-original.html" title="月相盈虧"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;if(!d)return;
 d.title='晟自然玩科學｜月相盈虧';
 const title=d.querySelector('.header-title');if(title)title.innerHTML='<span class="brand-name">晟自然玩科學</span><span class="title-divider">｜</span><span class="module-name">月相盈虧</span>';
 const style=d.createElement('style');style.textContent=`
 :root{--subject:#b79ad7;--subject-deep:#8266aa;--subject-soft:#f3edf9;--subject-line:#d8c7e9;--ink:#3f3f46}
 .main-header{flex-basis:60px!important;min-height:60px!important;padding:0 15px!important;gap:0!important}.logo-area{width:40px!important;height:40px!important;margin-right:14px!important}.header-title{min-width:0!important;display:flex!important;align-items:center!important;flex-wrap:nowrap!important;gap:7px!important;font-size:1rem!important;line-height:1!important;white-space:nowrap!important;overflow:hidden!important;padding-right:10px!important}.brand-name{font-weight:900;letter-spacing:.02em;flex-shrink:0}.title-divider{opacity:.65;font-weight:400;flex-shrink:0}.module-name{font-weight:600;overflow:hidden;text-overflow:ellipsis}.line-btn{flex-shrink:0!important;margin-left:auto!important;padding:6px 11px!important;font-size:.82rem!important;line-height:1!important}
 #simWrapper{order:1}.ui-card-style{order:2;width:calc(100% - 24px)!important;max-width:576px!important;margin:10px 12px 12px!important;padding:10px 12px 11px!important;background:rgba(255,255,255,.97)!important;border:1.5px solid var(--subject-line)!important;border-left:5px solid var(--subject)!important;border-radius:14px!important;box-shadow:0 3px 12px rgba(70,55,90,.10)!important}.info-header{min-height:34px!important;padding-bottom:7px!important;margin-bottom:6px!important;border-bottom:1px solid var(--subject-line)!important}.date-display{font-size:1.05rem!important;padding:4px 9px!important;color:var(--ink)!important;background:var(--subject-soft)!important;border-radius:8px!important}.phase-name{font-size:1.08rem!important;color:var(--subject-deep)!important}.info-grid{gap:3px 10px!important}.info-item{min-height:30px!important;font-size:.88rem!important;line-height:1.3!important}.label{width:auto!important;min-width:6.6em!important;margin-right:4px!important;font-size:.88rem!important}.desc-wrapper{min-height:auto!important;margin-top:5px!important;padding-top:7px!important;border-top:1px dashed var(--subject-line)!important;font-size:.88rem!important;line-height:1.4!important}
 .controls-dock{width:calc(100% - 20px)!important;margin:0 10px 8px!important;padding:10px 12px calc(10px + env(safe-area-inset-bottom))!important;background:rgba(255,255,255,.98)!important;border:1.5px solid var(--subject-line)!important;border-radius:14px!important;box-shadow:0 -2px 12px rgba(70,55,90,.08),0 3px 12px rgba(70,55,90,.08)!important;gap:6px!important}.control-row{gap:8px!important;margin-bottom:2px!important}.control-row label{color:#555!important;font-size:.9rem!important}.btn,.time-btn,.festival-select{border-color:var(--subject-line)!important;border-radius:9px!important;color:#554a60!important;background:#fff!important;box-shadow:none!important}.btn{padding:7px 5px!important}.time-btn{padding:6px 5px!important}.btn:hover,.time-btn:hover{background:var(--subject-soft)!important;border-color:var(--subject)!important}.btn.active{background:var(--subject)!important;color:#fff!important;border-color:var(--subject-deep)!important}input[type=range]{accent-color:var(--subject)!important}input[type=range]::-webkit-slider-thumb{background:var(--subject)!important}input[type=range]::-moz-range-thumb{background:var(--subject)!important}.btn-auto{background:var(--subject)!important;border-radius:8px!important;color:white!important}.btn-auto:hover{background:var(--subject-deep)!important}.btn-auto.active{background:var(--subject-deep)!important}
 @media(max-width:430px){.main-header{padding:0 10px!important}.logo-area{width:36px!important;height:36px!important;margin-right:9px!important}.header-title{font-size:.88rem!important;gap:4px!important;padding-right:6px!important}.line-btn{font-size:.74rem!important;padding:6px 8px!important}.ui-card-style{width:calc(100% - 16px)!important;margin:8px 8px 10px!important;padding:9px 10px!important}.controls-dock{width:calc(100% - 12px)!important;margin:0 6px 6px!important;padding-left:9px!important;padding-right:9px!important}.info-item{font-size:.82rem!important}.label{font-size:.82rem!important;min-width:6.2em!important}}
 `;d.head.appendChild(style);
});
</script>
</body></html>
